AWSTemplateFormatVersion: '2010-09-09'

Description: >
  IAM roles and GitHub connection, prerequisites before pipeline.yml and ecs.yaml.
  - CodePipelineServiceRole: permissions to orchestrate source/build/deploy.
  - CodeDeployServiceRole: permissions for ECS Blue/Green deployment.
  - EcsTaskExecutionRole: permissions for ECS Fargate to START the task
    (pull ECR image, write logs, read secrets).
  - EcsTaskRole: permissions for the APPLICATION CODE while it runs
    (to be expanded based on app needs).
  - GitHubConnection: CodeStar Connections bridge between GitHub and
    CodePipeline (requires a single manual authorization in the AWS console
    after deployment).

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER:
#   1. vpc.yml   2. secrets-manager.yaml   3. ecr.yaml   4. codebuild.yaml
#   5. iam.yaml   <- this stack
#   6. ecs-cluster.yaml   7. alb.yaml   8. ecs-task-definition.yaml
#   9. ecs-service.yaml   10. pipeline.yml   11. ecs-autoscaling.yaml
#   12. observability.yml
#
# iam.yaml imports the CodeBuild project ARN (codebuild.yaml) for the
# CodePipeline role's codebuild:StartBuild/BatchGetBuilds permissions, and
# therefore deploys right after codebuild.yaml: most of the following
# stacks then import iam.yaml's roles in turn.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

Resources:

  # ==========================================================================
  # GITHUB CONNECTION (CodeStar Connections)
  # Replaces the OAuth token used by CodeBuild alone: this is THE official
  # mechanism for CodePipeline to trigger on a GitHub push without storing
  # credentials. The resource is created in "PENDING" state: a manual
  # authorization in the AWS console (Developer Tools > Connections) is
  # REQUIRED once after deployment — this cannot be fully automated in
  # CloudFormation, it is a known limitation of the service.
  # ==========================================================================
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-${Environment}-github'
      ProviderType: GitHub
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # CODEPIPELINE ROLE
  # Assumed by the codepipeline.amazonaws.com service to orchestrate the
  # Source -> Build -> Deploy stages. Each permission is restricted to the
  # exact resource this project needs (no "*" except when the AWS service
  # explicitly requires it).
  # ==========================================================================
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codepipeline-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Source stage: read/write artifacts in the S3 bucket dedicated
              # to the pipeline. The bucket will be created IN pipeline.yaml
              # (not here); its name is referenced by CONVENTION rather than
              # by Fn::ImportValue, to avoid a circular dependency between
              # iam.yaml and pipeline.yaml (the role must exist BEFORE the
              # pipeline, but the pipeline creates the bucket).
              - Sid: PipelineArtifactsBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}/*'

              # Source stage: use the GitHub connection created above
              # (restricted to THIS specific connection, not all connections
              # in the account)
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource:
                  - !Ref GitHubConnection

              # Build stage: trigger ONLY the CodeBuild project created in
              # codebuild.yaml (imports its exported ARN -> no duplication,
              # consistency guaranteed between stacks)
              - Sid: TriggerCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-codebuild-arn'

              # Deploy stage: drive CodeDeploy for ECS Blue/Green. Restricted
              # by NAMING CONVENTION (the CodeDeploy application and
              # deployment group will be created in pipeline.yaml, so there
              # is no real ARN to import yet at this stage).
              - Sid: TriggerCodeDeploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${ProjectName}-${Environment}-*'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ProjectName}-${Environment}-*'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'

              # CodePipeline "CodeDeployToECS" action (ECS Blue/Green, NOT the
              # generic CodeDeploy provider above): on each execution,
              # CodePipeline itself generates a NEW task definition revision
              # from taskdef.json + imageDetail.json, BEFORE triggering
              # CodeDeploy. This requires two permissions documented by AWS
              # specifically for this provider
              # (docs.aws.amazon.com/codepipeline/.../action-reference-ECSbluegreen.html#edit-role-codedeploy-ecs),
              # not present in the TriggerCodeDeploy block above: without
              # them, the Deploy stage fails when registering the task
              # definition.
              - Sid: AllowEcsRegisterTaskDefinitionForBlueGreen
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                # ecs:RegisterTaskDefinition does not accept an ARN-based
                # restriction (AWS constraint, like ecr:GetAuthorizationToken).
                Resource: '*'

              # iam:PassRole restricted to the TWO ECS task roles defined
              # further below in THIS SAME template (EcsTaskExecutionRole /
              # EcsTaskRole): needed so CodePipeline can attach them to the
              # new task definition revision it registers. iam:PassedToService
              # condition to prevent this role from being used to pass these
              # ARNs to any service other than ECS. ARN built by naming
              # convention (like TriggerCodeDeploy above) rather than via
              # !GetAtt, to stay consistent with the rest of the file and
              # avoid any dependency on the creation order between roles in
              # the same template.
              - Sid: PassEcsRolesForBlueGreenDeployment
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-ecs-execution-role'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-ecs-task-role'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs.amazonaws.com
                      - ecs-tasks.amazonaws.com

              # Publish to the project's SNS topic, restricted by naming
              # convention.
              #
              # This is the permission used by the Approval stage of
              # pipeline.yml: when the pipeline pauses for approval,
              # CodePipeline itself publishes the approval message (with the
              # link) via the service role, thanks to the action's
              # NotificationArn. The statement already existed in
              # anticipation of this stage — it is now actually used.
              #
              # No change to the SNS topic policy is necessary: within the
              # same account, this identity-based permission is sufficient.
              - Sid: PublishPipelineNotifications
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-*'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # CODEDEPLOY ROLE
  # We use the official AWS managed policy for ECS Blue/Green: it already
  # covers ecs:*, elasticloadbalancing:*, and a correctly restricted
  # iam:PassRole (condition iam:PassedToService=ecs-tasks) to pass the ECS
  # task roles. Rewriting these permissions by hand would be riskier (easy
  # to forget a permission) than reliable.
  # ==========================================================================
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codedeploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # ECS EXECUTION ROLE (EcsTaskExecutionRole)
  # Used by the ECS AGENT (not your application code) to START the
  # container: pulling the ECR image, writing logs to CloudWatch, and
  # reading Secrets Manager secrets to inject them at runtime (architecture
  # decision already documented: never a plaintext secret in the template's
  # environment variables).
  # ==========================================================================
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-ecs-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Official AWS managed policy: ECR pull + CloudWatch logs.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ecs-secrets-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permission used by the ECS AGENT (not by the application code)
              # to read the secrets declared in the Secrets block of the task
              # definition, when each task starts. Without it, tasks fail
              # with ResourceInitializationError.
              - Sid: ReadAppSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  # Restriction by name prefix rather than by an ARN imported
                  # from secrets-manager.yaml: the wildcard covers the random
                  # 6-character suffix that AWS appends to secret ARNs, and
                  # more importantly this keeps iam.yaml free of a dependency
                  # on the secrets stack — iam.yaml deploys 2nd, before it,
                  # and many other stacks import its roles.
                  # The restriction remains strict: this role can read ONLY
                  # the secrets for this project and this environment.
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*'
              # Deliberately NO kms:Decrypt here: the secrets in
              # secrets-manager.yaml use the AWS-managed key
              # (alias/aws/secretsmanager), for which no explicit KMS
              # permission is required. If a secret is ever encrypted with a
              # customer-managed KMS key, a kms:Decrypt statement on that
              # key's ARN WILL NEED to be added here, otherwise ECS tasks
              # will stop starting.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # ECS APPLICATION ROLE (EcsTaskRole)
  # Used by YOUR CODE (the Node.js task manager) while it runs, in case it
  # ever needs to call the AWS API itself (e.g. writing a custom metric).
  # Deliberately minimal for now: to be expanded as soon as the application
  # has an identified need (e.g. DynamoDB, S3, SQS...). NEVER reuse
  # EcsTaskExecutionRole for this — these are two distinct responsibilities
  # by AWS design (starting the container vs. application code).
  # ==========================================================================
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ecs-task-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Minimal starting permission: send custom CloudWatch metrics
              # from the app. Add the actual permissions here (DynamoDB,
              # S3...) as the app's needs arise.
              - Sid: PublishCustomMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub '${ProjectName}/${Environment}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  GitHubConnectionArn:
    Description: >
      ARN of the GitHub connection. State is "PENDING" after deployment:
      go to the AWS console (Developer Tools > Connections) to authorize it
      manually before deploying pipeline.yaml.
    Value: !Ref GitHubConnection
    Export:
      Name: !Sub '${ProjectName}-${Environment}-github-connection-arn'

  CodePipelineServiceRoleArn:
    Description: ARN of the role used by pipeline.yaml
    Value: !GetAtt CodePipelineServiceRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codepipeline-role-arn'

  CodeDeployServiceRoleArn:
    Description: ARN of the role used by the CodeDeploy Deployment Group in pipeline.yaml
    Value: !GetAtt CodeDeployServiceRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codedeploy-role-arn'

  EcsTaskExecutionRoleArn:
    Description: ARN of the execution role used by the ECS Task Definition in ecs.yaml
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-execution-role-arn'

  EcsTaskRoleArn:
    Description: ARN of the application role used by the ECS Task Definition in ecs.yaml
    Value: !GetAtt EcsTaskRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-task-role-arn'