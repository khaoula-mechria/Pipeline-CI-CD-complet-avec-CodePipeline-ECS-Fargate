AWSTemplateFormatVersion: '2010-09-09'

Description: >
  IAM roles and GitHub connection, prerequisites before pipeline.yml and ecs.yaml.
  - CodePipelineServiceRole: permissions to orchestrate source/build/deploy.
  - CodeDeployServiceRole: permissions for ECS Blue/Green deployment.
  - EcsTaskExecutionRole: permissions for ECS Fargate to START the task
    (pull ECR image, write logs, read secrets).
  - EcsTaskRole: permissions for the APPLICATION CODE while it runs
    (to be expanded based on app needs).
  - GitHubConnection: CodeStar Connections bridge between GitHub and
    CodePipeline (requires a single manual authorization in the AWS console
    after deployment).

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT :
#   1. vpc.yml   2. iam.yaml   <- cette stack
#   3. secrets-manager.yaml   4. ecr.yaml   5. codebuild.yaml
#   6. ecs-cluster.yaml   7. alb.yaml   8. ecs-task-definition.yaml
#   9. ecs-service.yaml   10. pipeline.yml   11. observability.yml
#
# iam.yaml n'importe rien d'autre que l'ARN du repo ECR (statement ECR de
# CodeBuild) et se deploie donc tres tôt : la plupart des stacks suivantes
# importent ses rôles.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

Resources:

  # ==========================================================================
  # CONNEXION GITHUB (CodeStar Connections)
  # Remplace le token OAuth utilise par CodeBuild seul : c'est LE mecanisme
  # officiel pour que CodePipeline declenche sur push GitHub sans stocker
  # de credentials. La ressource se cree en etat "PENDING" : une autorisation
  # manuelle dans la console AWS (Developer Tools > Connections) est
  # OBLIGATOIRE une seule fois apres le deploiement — impossible a automatiser
  # entierement en CloudFormation, c'est une limite connue du service.
  # ==========================================================================
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-${Environment}-github'
      ProviderType: GitHub
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # RÔLE CODEPIPELINE
  # Endosse par le service codepipeline.amazonaws.com pour orchestrer les
  # stages Source -> Build -> Deploy. Chaque permission est restreinte a la
  # ressource precise dont ce projet a besoin (pas de "*" sauf quand le
  # service AWS l'exige explicitement).
  # ==========================================================================
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codepipeline-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Stage Source : lire/ecrire les artefacts dans le bucket S3
              # dedie au pipeline. Le bucket sera cree DANS pipeline.yaml
              # (pas ici) ; on reference son nom par CONVENTION plutôt que
              # par Fn::ImportValue, pour eviter une dependance circulaire
              # entre iam.yaml et pipeline.yaml (le rôle doit exister AVANT
              # le pipeline, mais le pipeline cree le bucket).
              - Sid: PipelineArtifactsBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}/*'

              # Stage Source : utiliser la connexion GitHub creee ci-dessus
              # (restreint a CETTE connexion precise, pas toutes les connexions
              # du compte)
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource:
                  - !Ref GitHubConnection

              # Stage Build : declencher UNIQUEMENT le projet CodeBuild cree
              # dans codebuild.yaml (import de son ARN exporte -> pas de
              # duplication, coherence garantie entre les stacks)
              - Sid: TriggerCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-codebuild-arn'

              # Stage Deploy : piloter CodeDeploy pour le Blue/Green ECS.
              # Restreint par CONVENTION DE NOMMAGE (l'application et le
              # deployment group CodeDeploy seront crees dans pipeline.yaml,
              # donc pas encore d'ARN reel a importer a ce stade).
              - Sid: TriggerCodeDeploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${ProjectName}-${Environment}-*'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ProjectName}-${Environment}-*'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'

              # Action CodePipeline "CodeDeployToECS" (Blue/Green ECS, PAS le
              # provider CodeDeploy generique ci-dessus) : a chaque execution,
              # CodePipeline genere lui-même une NOUVELLE revision de la task
              # definition a partir de taskdef.json + imageDetail.json, AVANT
              # de declencher CodeDeploy. Ça necessite deux permissions
              # documentees par AWS specifiquement pour ce provider
              # (docs.aws.amazon.com/codepipeline/.../action-reference-ECSbluegreen.html#edit-role-codedeploy-ecs),
              # absentes du bloc TriggerCodeDeploy ci-dessus : sans elles, le
              # stage Deploy echoue a l'enregistrement de la task definition.
              - Sid: AllowEcsRegisterTaskDefinitionForBlueGreen
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                # ecs:RegisterTaskDefinition n'accepte pas de restriction par
                # ARN (contrainte AWS, comme ecr:GetAuthorizationToken).
                Resource: '*'

              # iam:PassRole restreint aux DEUX rôles de tache ECS definis
              # plus bas dans CE MÊME template (EcsTaskExecutionRole /
              # EcsTaskRole) : necessaire pour que CodePipeline puisse les
              # associer a la nouvelle revision de task definition qu'il
              # enregistre. Condition iam:PassedToService pour empêcher que
              # ce rôle serve a passer ces ARN a un autre service qu'ECS.
              # ARN construit par convention de nommage (comme TriggerCodeDeploy
              # plus haut) plutôt que par !GetAtt, pour rester coherent avec le
              # reste du fichier et eviter toute dependance a l'ordre de
              # creation entre rôles du même template.
              - Sid: PassEcsRolesForBlueGreenDeployment
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-ecs-execution-role'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-ecs-task-role'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs.amazonaws.com
                      - ecs-tasks.amazonaws.com

              # Publication sur le topic SNS du projet, restreinte par
              # convention de nommage.
              #
              # C'est CETTE permission qu'utilise le stage Approval de
              # pipeline.yml : quand le pipeline se met en attente, CodePipeline
              # publie lui-même le message d'approbation (avec le lien) via le
              # rôle de service, grace au NotificationArn de l'action. Le
              # statement existait deja en prevision de ce stage — il est
              # maintenant reellement utilise.
              #
              # Aucune modification de la policy du topic SNS n'est necessaire :
              # en intra-compte, cette autorisation identity-based suffit.
              - Sid: PublishPipelineNotifications
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-*'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # RÔLE CODEDEPLOY
  # On utilise la politique managee officielle AWS pour le Blue/Green ECS :
  # elle couvre deja ecs:*, elasticloadbalancing:*, et un iam:PassRole
  # correctement restreint (condition iam:PassedToService=ecs-tasks) pour
  # passer les rôles de tache ECS. Reecrire ces permissions a la main serait
  # plus risque (facile d'oublier une permission) que fiable.
  # ==========================================================================
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codedeploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # RÔLE D'EXeCUTION ECS (EcsTaskExecutionRole)
  # Utilise par l'AGENT ECS (pas ton code applicatif) pour DeMARRER le
  # conteneur : pull de l'image ECR, ecriture des logs vers CloudWatch,
  # et lecture des secrets Secrets Manager pour les injecter au runtime
  # (decision d'architecture deja documentee : jamais de secret en clair
  # dans les variables d'environnement du template).
  # ==========================================================================
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-ecs-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Politique managee officielle AWS : pull ECR + logs CloudWatch.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ecs-secrets-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permission utilisee par l'AGENT ECS (pas par le code applicatif)
              # pour lire les secrets declares dans le bloc Secrets de la task
              # definition, au demarrage de chaque tache. Sans elle, les taches
              # echouent avec ResourceInitializationError.
              - Sid: ReadAppSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  # Restriction par prefixe de nom plutôt que par ARN importe
                  # de secrets-manager.yaml : le wildcard couvre le suffixe
                  # aleatoire de 6 caracteres qu'AWS ajoute aux ARN de secrets,
                  # et surtout ça garde iam.yaml sans dependance vers la stack
                  # de secrets — iam.yaml se deploie en 2e position, avant elle,
                  # et beaucoup d'autres stacks importent ses rôles.
                  # La restriction reste stricte : ce rôle ne peut lire QUE les
                  # secrets de ce projet et de cet environnement.
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*'
              # PAS de kms:Decrypt ici, volontairement : les secrets de
              # secrets-manager.yaml utilisent la cle geree par AWS
              # (alias/aws/secretsmanager), pour laquelle aucune permission KMS
              # explicite n'est requise. Si un jour un secret est chiffre avec
              # une cle KMS geree par le client, il FAUDRA ajouter ici un
              # statement kms:Decrypt sur l'ARN de cette cle, sinon les taches
              # ECS ne demarreront plus.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # RÔLE APPLICATIF ECS (EcsTaskRole)
  # Utilise par TON CODE (le task manager Node.js) pendant qu'il tourne, si
  # jamais il a besoin d'appeler l'API AWS lui-même (ex: ecrire une metrique
  # custom). Volontairement minimal pour l'instant : a enrichir des que
  # l'application a un besoin identifie (ex: DynamoDB, S3, SQS...). Ne JAMAIS
  # reutiliser EcsTaskExecutionRole pour ça — ce sont deux responsabilites
  # distinctes par design AWS (demarrage du conteneur vs code applicatif).
  # ==========================================================================
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ecs-task-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permission minimale de depart : envoyer des metriques custom
              # CloudWatch depuis l'app. Ajoute ici les permissions reelles
              # (DynamoDB, S3...) au fur et a mesure des besoins de l'app.
              - Sid: PublishCustomMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub '${ProjectName}/${Environment}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  GitHubConnectionArn:
    Description: >
      ARN of the GitHub connection. State is "PENDING" after deployment:
      go to the AWS console (Developer Tools > Connections) to authorize it
      manually before deploying pipeline.yaml.
    Value: !Ref GitHubConnection
    Export:
      Name: !Sub '${ProjectName}-${Environment}-github-connection-arn'

  CodePipelineServiceRoleArn:
    Description: ARN of the role used by pipeline.yaml
    Value: !GetAtt CodePipelineServiceRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codepipeline-role-arn'

  CodeDeployServiceRoleArn:
    Description: ARN of the role used by the CodeDeploy Deployment Group in pipeline.yaml
    Value: !GetAtt CodeDeployServiceRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codedeploy-role-arn'

  EcsTaskExecutionRoleArn:
    Description: ARN of the execution role used by the ECS Task Definition in ecs.yaml
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-execution-role-arn'

  EcsTaskRoleArn:
    Description: ARN of the application role used by the ECS Task Definition in ecs.yaml
    Value: !GetAtt EcsTaskRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-task-role-arn'