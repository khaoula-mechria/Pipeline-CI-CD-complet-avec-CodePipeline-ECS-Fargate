AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Secrets applicatifs (AWS Secrets Manager) pour le projet (CI/CD AWS).
  F3 du cahier des charges : "Les secrets (DB password, API keys) sont injectés
  via AWS Secrets Manager, jamais en clair dans les variables d'environnement".
  - Crée 2 secrets sous le prefixe <ProjectName>/<Environment>/ (prefixe deja
    autorise par la policy ReadAppSecrets de EcsTaskExecutionRole, iam.yaml).
  - AUCUNE valeur sensible n'apparaît dans ce template : les deux secrets sont
    générés par AWS (GenerateSecretString), jamais écrits en dur ni passés en
    paramètre de stack.
  - Les ARN sont exportés ; ecs-task-definition.yaml et taskdef.template.json
    (via codebuild.yaml) les consomment dans un bloc Secrets/secrets.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DÉPLOIEMENT :
#   1. vpc.yml   2. iam.yaml   3. secrets-manager.yaml   <- cette stack
#   4. ecr.yaml   5. codebuild.yaml   6. ecs-cluster.yaml   7. alb.yaml
#   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml   11. observability.yml
#
# Doit être déployée AVANT codebuild.yaml (qui importe les 2 ARN pour les
# injecter dans taskdef.json) et AVANT ecs-task-definition.yaml.
#
# ATTENTION — conséquence opérationnelle : dès qu'une task definition déclare
# un bloc Secrets, ECS refuse de démarrer la tâche s'il n'arrive pas à lire le
# secret (erreur ResourceInitializationError). Cette stack n'est donc pas
# optionnelle : si elle est absente ou supprimée, le service ECS ne démarre
# plus du tout.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# PARAMÈTRES
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Doit correspondre à l'Environment des autres stacks.

  DbUsername:
    Type: String
    Default: taskmanager_app
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: >
      Nom d'utilisateur applicatif de la base. Non sensible en soi (c'est le
      mot de passe qui l'est), mais stocké DANS le secret pour que
      l'application n'ait qu'une seule source à lire.

  DbPasswordLength:
    Type: Number
    Default: 32
    MinValue: 16
    MaxValue: 128
    Description: Longueur du mot de passe généré automatiquement par AWS.

# ------------------------------------------------------------------
# RESSOURCES
# ------------------------------------------------------------------
Resources:

  # ==========================================================================
  # SECRET 1 — credentials de base de données (format JSON)
  #
  # GenerateSecretString génère le mot de passe côté AWS à la création de la
  # stack : la valeur n'existe jamais dans le dépôt, ni dans les paramètres
  # CloudFormation, ni dans les logs. C'est précisément ce qu'exige F3.
  #
  # Le secret contient un JSON {"username": "...", "password": "..."} : la
  # task definition extrait chaque champ séparément grâce à la syntaxe
  # "<arn>:<cléJson>::" de ECS (voir ecs-task-definition.yaml).
  # ==========================================================================
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/db'
      Description: !Sub 'Credentials de base de données pour ${ProjectName} (${Environment})'
      GenerateSecretString:
        # Le template fournit les champs non générés ; GenerateStringKey
        # indique dans quelle clé AWS doit écrire la valeur générée.
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: !Ref DbPasswordLength
        # Caractères exclus : ils cassent les chaînes de connexion et/ou
        # doivent être URL-encodés (" @ / \).
        ExcludeCharacters: '"@/\'
        # Garantit au moins un caractère de chaque type inclus.
        RequireEachIncludedType: true
      # Pas de KmsKeyId : on utilise la clé gérée par AWS
      # (alias/aws/secretsmanager), gratuite. Conséquence IAM importante :
      # aucune permission kms:Decrypt n'est nécessaire sur
      # EcsTaskExecutionRole. Si un jour une clé KMS gérée par le client est
      # utilisée ici, il FAUDRA ajouter kms:Decrypt dans iam.yaml, sinon les
      # tâches ECS ne démarreront plus.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ==========================================================================
  # SECRET 2 — clé d'API d'un service tiers (valeur simple, pas de JSON)
  #
  # Une vraie clé d'API vient d'un fournisseur externe : elle ne peut pas être
  # "générée" par AWS. Elle est quand même créée ici avec une valeur aléatoire
  # (placeholder) plutôt que via un paramètre de stack, pour la même raison que
  # ci-dessus : aucune valeur sensible ne doit transiter par CloudFormation.
  #
  # La vraie valeur se pousse ensuite hors CloudFormation, une seule fois :
  #   aws secretsmanager put-secret-value \
  #     --secret-id taskmanager/dev/api-key \
  #     --secret-string '<LA_VRAIE_CLÉ>'
  #
  # Un update ultérieur de cette stack ne réécrase PAS cette valeur :
  # CloudFormation n'applique GenerateSecretString qu'à la création, et
  # put-secret-value crée simplement une nouvelle version du secret.
  # ==========================================================================
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/api-key'
      Description: !Sub >-
        Clé d'API tierce pour ${ProjectName} (${Environment}).
        Valeur initiale = placeholder aléatoire, à remplacer via
        "aws secretsmanager put-secret-value".
      GenerateSecretString:
        PasswordLength: 40
        # Clé d'API = alphanumérique, pas de ponctuation.
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ------------------------------------------------------------------
# OUTPUTS
# Les ARN (pas les valeurs !) sont exportés. Un ARN de secret n'est PAS une
# donnée sensible : c'est un identifiant. Seul un appel GetSecretValue
# autorisé par IAM permet d'en lire le contenu.
#
# Note : l'ARN d'un secret se termine par un suffixe aléatoire de 6
# caractères ajouté par AWS (ex: .../taskmanager/dev/db-AbC1dE). Il est donc
# impossible de le reconstruire par convention de nommage — d'où ces exports,
# consommés par ecs-task-definition.yaml et codebuild.yaml.
# ------------------------------------------------------------------
Outputs:
  DbSecretArn:
    Description: ARN du secret contenant les credentials de base de données
    Value: !Ref DbSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-arn'

  ApiKeySecretArn:
    Description: ARN du secret contenant la clé d'API tierce
    Value: !Ref ApiKeySecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-arn'

  DbSecretName:
    Description: Nom du secret DB (utile pour les commandes aws secretsmanager)
    Value: !Sub '${ProjectName}/${Environment}/db'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-name'

  ApiKeySecretName:
    Description: Nom du secret API key (utile pour put-secret-value)
    Value: !Sub '${ProjectName}/${Environment}/api-key'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-name'
