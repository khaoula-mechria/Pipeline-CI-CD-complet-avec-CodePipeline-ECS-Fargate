AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Application secrets (AWS Secrets Manager) for the project (AWS CI/CD).
  F3 of the requirements: "Secrets (DB password, API keys) are injected via AWS
  Secrets Manager, never in clear text in environment variables".
  - Creates 2 secrets under the <ProjectName>/<Environment>/ prefix (prefix
    already allowed by the ReadAppSecrets policy of EcsTaskExecutionRole,
    iam.yaml).
  - NO sensitive value appears in this template: both secrets are generated by
    AWS (GenerateSecretString), never written directly or passed as stack
    parameters.
  - ARNs are exported; ecs-task-definition.yaml and taskdef.template.json (via
    codebuild.yaml) consume them in a Secrets block.

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER:
#   1. vpc.yml   2. secrets-manager.yaml   <- this stack
#   3. ecr.yaml   4. codebuild.yaml   5. iam.yaml   6. ecs-cluster.yaml
#   7. alb.yaml   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml   11. ecs-autoscaling.yaml   12. observability.yml
#
# Must be deployed BEFORE codebuild.yaml (which imports the 2 ARNs to
# inject them into taskdef.json) and BEFORE ecs-task-definition.yaml.
#
# WARNING - operational consequence: as soon as a task definition declares
# a Secrets block, ECS refuses to start the task if it cannot read the
# secret (ResourceInitializationError). This stack is therefore not
# optional: if it is absent or deleted, the ECS service stops starting
# entirely.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# PARAMETERS
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment of the other stacks.

  DbUsername:
    Type: String
    Default: taskmanager_app
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: >
      Application database username. Not sensitive on its own (the password is),
      but stored in the secret so the application has only one source to read.

  DbPasswordLength:
    Type: Number
    Default: 32
    MinValue: 16
    MaxValue: 128
    Description: Length of the password generated automatically by AWS.

# ------------------------------------------------------------------
# RESOURCES
# ------------------------------------------------------------------
Resources:

  # ==========================================================================
  # SECRET 1 — database credentials (JSON format)
  #
  # GenerateSecretString generates the password on the AWS side when the
  # stack is created: the value never exists in the repository, nor in the
  # CloudFormation parameters, nor in the logs. This is exactly what F3
  # requires.
  #
  # The secret contains JSON {"username": "...", "password": "..."}: the
  # task definition extracts each field separately using the ECS
  # "<arn>:<jsonKey>::" syntax (see ecs-task-definition.yaml).
  # ==========================================================================
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/db'
      Description: !Sub 'Database credentials for ${ProjectName} (${Environment})'
      GenerateSecretString:
        # The template provides the non-generated fields; GenerateStringKey
        # indicates which key AWS should write the generated value into.
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: !Ref DbPasswordLength
        # Excluded characters: they break connection strings and/or must
        # be URL-encoded (" @ / \).
        ExcludeCharacters: '"@/\'
        # Guarantees at least one character of each included type.
        RequireEachIncludedType: true
      # No KmsKeyId: we use the AWS managed key
      # (alias/aws/secretsmanager), which is free. Important IAM
      # consequence: no kms:Decrypt permission is needed on
      # EcsTaskExecutionRole. If a customer-managed KMS key is ever used
      # here instead, kms:Decrypt MUST be added in iam.yaml, otherwise
      # the ECS tasks will stop starting.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ==========================================================================
  # SECRET 2 — third-party service API key (plain value, not JSON)
  #
  # A real API key comes from an external provider: it cannot be
  # "generated" by AWS. It is nevertheless created here with a random
  # (placeholder) value rather than through a stack parameter, for the
  # same reason as above: no sensitive value should ever pass through
  # CloudFormation.
  #
  # The real value is then pushed outside of CloudFormation, just once:
  #   aws secretsmanager put-secret-value \
  #     --secret-id taskmanager/dev/api-key \
  #     --secret-string '<THE_REAL_KEY>'
  #
  # A later update of this stack does NOT overwrite this value:
  # CloudFormation only applies GenerateSecretString at creation time, and
  # put-secret-value simply creates a new version of the secret.
  # ==========================================================================
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/api-key'
      Description: !Sub >-
        Third-party API key for ${ProjectName} (${Environment}).
        Initial value = random placeholder, to be replaced via
        "aws secretsmanager put-secret-value".
      GenerateSecretString:
        PasswordLength: 40
        # API key = alphanumeric, no punctuation.
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ------------------------------------------------------------------
# OUTPUTS
# The ARNs (not the values!) are exported. A secret ARN is NOT sensitive
# data: it is an identifier. Only a GetSecretValue call authorized by IAM
# allows reading its content.
#
# Note: a secret's ARN ends with a random 6-character suffix added by AWS
# (e.g. .../taskmanager/dev/db-AbC1dE). It is therefore impossible to
# reconstruct it by naming convention — hence these exports, consumed by
# ecs-task-definition.yaml and codebuild.yaml.
# ------------------------------------------------------------------
Outputs:
  DbSecretArn:
    Description: ARN of the secret containing the database credentials
    Value: !Ref DbSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-arn'

  ApiKeySecretArn:
    Description: ARN of the secret containing the third-party API key
    Value: !Ref ApiKeySecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-arn'

  DbSecretName:
    Description: Name of the DB secret (useful for aws secretsmanager commands)
    Value: !Sub '${ProjectName}/${Environment}/db'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-name'

  ApiKeySecretName:
    Description: Name of the API key secret (useful for put-secret-value)
    Value: !Sub '${ProjectName}/${Environment}/api-key'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-name'
