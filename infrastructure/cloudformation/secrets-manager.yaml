AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Application secrets (AWS Secrets Manager) for the project (AWS CI/CD).
  F3 of the requirements: "Secrets (DB password, API keys) are injected via AWS
  Secrets Manager, never in clear text in environment variables".
  - Creates 2 secrets under the <ProjectName>/<Environment>/ prefix (prefix
    already allowed by the ReadAppSecrets policy of EcsTaskExecutionRole,
    iam.yaml).
  - NO sensitive value appears in this template: both secrets are generated by
    AWS (GenerateSecretString), never written directly or passed as stack
    parameters.
  - ARNs are exported; ecs-task-definition.yaml and taskdef.template.json (via
    codebuild.yaml) consume them in a Secrets block.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT :
#   1. vpc.yml   2. iam.yaml   3. secrets-manager.yaml   <- cette stack
#   4. ecr.yaml   5. codebuild.yaml   6. ecs-cluster.yaml   7. alb.yaml
#   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml   11. observability.yml
#
# Doit être deployee AVANT codebuild.yaml (qui importe les 2 ARN pour les
# injecter dans taskdef.json) et AVANT ecs-task-definition.yaml.
#
# ATTENTION — consequence operationnelle : des qu'une task definition declare
# un bloc Secrets, ECS refuse de demarrer la tache s'il n'arrive pas a lire le
# secret (erreur ResourceInitializationError). Cette stack n'est donc pas
# optionnelle : si elle est absente ou supprimee, le service ECS ne demarre
# plus du tout.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# PARAMeTRES
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment of the other stacks.

  DbUsername:
    Type: String
    Default: taskmanager_app
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: >
      Application database username. Not sensitive on its own (the password is),
      but stored in the secret so the application has only one source to read.

  DbPasswordLength:
    Type: Number
    Default: 32
    MinValue: 16
    MaxValue: 128
    Description: Length of the password generated automatically by AWS.

# ------------------------------------------------------------------
# RESSOURCES
# ------------------------------------------------------------------
Resources:

  # ==========================================================================
  # SECRET 1 — credentials de base de donnees (format JSON)
  #
  # GenerateSecretString genere le mot de passe côte AWS a la creation de la
  # stack : la valeur n'existe jamais dans le depôt, ni dans les parametres
  # CloudFormation, ni dans les logs. C'est precisement ce qu'exige F3.
  #
  # Le secret contient un JSON {"username": "...", "password": "..."} : la
  # task definition extrait chaque champ separement grace a la syntaxe
  # "<arn>:<cleJson>::" de ECS (voir ecs-task-definition.yaml).
  # ==========================================================================
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/db'
      Description: !Sub 'Credentials de base de donnees pour ${ProjectName} (${Environment})'
      GenerateSecretString:
        # Le template fournit les champs non generes ; GenerateStringKey
        # indique dans quelle cle AWS doit ecrire la valeur generee.
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: !Ref DbPasswordLength
        # Caracteres exclus : ils cassent les chaînes de connexion et/ou
        # doivent être URL-encodes (" @ / \).
        ExcludeCharacters: '"@/\'
        # Garantit au moins un caractere de chaque type inclus.
        RequireEachIncludedType: true
      # Pas de KmsKeyId : on utilise la cle geree par AWS
      # (alias/aws/secretsmanager), gratuite. Consequence IAM importante :
      # aucune permission kms:Decrypt n'est necessaire sur
      # EcsTaskExecutionRole. Si un jour une cle KMS geree par le client est
      # utilisee ici, il FAUDRA ajouter kms:Decrypt dans iam.yaml, sinon les
      # taches ECS ne demarreront plus.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ==========================================================================
  # SECRET 2 — cle d'API d'un service tiers (valeur simple, pas de JSON)
  #
  # Une vraie cle d'API vient d'un fournisseur externe : elle ne peut pas être
  # "generee" par AWS. Elle est quand même creee ici avec une valeur aleatoire
  # (placeholder) plutôt que via un parametre de stack, pour la même raison que
  # ci-dessus : aucune valeur sensible ne doit transiter par CloudFormation.
  #
  # La vraie valeur se pousse ensuite hors CloudFormation, une seule fois :
  #   aws secretsmanager put-secret-value \
  #     --secret-id taskmanager/dev/api-key \
  #     --secret-string '<LA_VRAIE_CLe>'
  #
  # Un update ulterieur de cette stack ne reecrase PAS cette valeur :
  # CloudFormation n'applique GenerateSecretString qu'a la creation, et
  # put-secret-value cree simplement une nouvelle version du secret.
  # ==========================================================================
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/api-key'
      Description: !Sub >-
        Cle d'API tierce pour ${ProjectName} (${Environment}).
        Valeur initiale = placeholder aleatoire, a remplacer via
        "aws secretsmanager put-secret-value".
      GenerateSecretString:
        PasswordLength: 40
        # Cle d'API = alphanumerique, pas de ponctuation.
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ------------------------------------------------------------------
# OUTPUTS
# Les ARN (pas les valeurs !) sont exportes. Un ARN de secret n'est PAS une
# donnee sensible : c'est un identifiant. Seul un appel GetSecretValue
# autorise par IAM permet d'en lire le contenu.
#
# Note : l'ARN d'un secret se termine par un suffixe aleatoire de 6
# caracteres ajoute par AWS (ex: .../taskmanager/dev/db-AbC1dE). Il est donc
# impossible de le reconstruire par convention de nommage — d'où ces exports,
# consommes par ecs-task-definition.yaml et codebuild.yaml.
# ------------------------------------------------------------------
Outputs:
  DbSecretArn:
    Description: ARN of the secret containing the database credentials
    Value: !Ref DbSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-arn'

  ApiKeySecretArn:
    Description: ARN of the secret containing the third-party API key
    Value: !Ref ApiKeySecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-arn'

  DbSecretName:
    Description: Name of the DB secret (useful for aws secretsmanager commands)
    Value: !Sub '${ProjectName}/${Environment}/db'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-db-secret-name'

  ApiKeySecretName:
    Description: Name of the API key secret (useful for put-secret-value)
    Value: !Sub '${ProjectName}/${Environment}/api-key'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-key-secret-name'
