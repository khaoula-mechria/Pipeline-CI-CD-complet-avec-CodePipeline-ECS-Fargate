AWSTemplateFormatVersion: '2010-09-09'

# ------------------------------------------------------------------
# ENCODING NOTE
# This file is deliberately in pure ASCII (no accents, no special
# characters). The CloudFormation console was displaying "priv??"
# instead of "prive" (private): the UTF-8 bytes of accented characters
# were being decoded incorrectly in the Description field. Please do
# NOT reintroduce accented characters in the values (Description,
# ParameterLabels, Outputs), or you will reproduce the problem.
# ------------------------------------------------------------------

Description: >-
  Amazon ECR private registry (AWS CI/CD) - stores Docker images built by
  CodeBuild. Scan on push is enabled, AES256 encryption is used, and tags are
  immutable. Lifecycle Policy: expires untagged images and keeps only the last
  N images.

# ------------------------------------------------------------------
# CONSOLE INTERFACE
# Groups the parameters when the template is deployed from the
# CloudFormation console (purely cosmetic).
# ------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: Image lifecycle
        Parameters:
          - MaxImageCount
          - UntaggedRetentionDays
    ParameterLabels:
      ProjectName:
        default: Project name (lowercase)
      Environment:
        default: Target environment
      MaxImageCount:
        default: Number of images to keep
      UntaggedRetentionDays:
        default: Untagged image retention (days)

# ------------------------------------------------------------------
# PARAMETERS
# Allow the same template to be reused for dev / staging / prod
# without duplicating code (IaC best practice).
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    Description: >-
      Project name, used as a resource naming prefix.
      Must be lowercase (ECR constraint).
    # The pattern forbids a trailing hyphen and requires the name to start with a letter.
    AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
    MinLength: 2
    MaxLength: 30
    ConstraintDescription: >-
      2 to 30 characters, lowercase / numbers / hyphens, must start with a
      letter and not end with a hyphen.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Target environment. Affects the repository name.

  MaxImageCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >-
      Maximum number of images kept by the Lifecycle Policy.
      Past this limit, the oldest images are deleted automatically.

  UntaggedRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 30
    Description: >-
      Retention period for untagged images (layers left by failed or interrupted
      builds) before automatic expiration.

# ------------------------------------------------------------------
# RESOURCES
# ------------------------------------------------------------------
Resources:

  # The ECR repository itself.
  #
  # AWS::ECR::Repository ALWAYS creates a PRIVATE registry: there is no
  # "public" option here. A public registry would be a resource of a
  # different type (AWS::ECR::PublicRepository).
  AppRepository:
    Type: AWS::ECR::Repository

    # CloudFormation CANNOT delete a non-empty ECR repository: stack
    # deletion would fail with DELETE_FAILED as soon as an image is
    # present. The resource is therefore explicitly retained, which
    # also protects the artifacts in prod.
    # For a disposable dev stack: set DeletionPolicy to "Delete" and
    # EmptyOnDelete to true below.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}'

      # Explicit: do not automatically empty the repository on deletion
      # (consistent with DeletionPolicy: Retain).
      EmptyOnDelete: false

      # MUTABLE: switched back from IMMUTABLE on 2026-08-14. IMMUTABLE was
      # meant to stop a commit-SHA tag from being silently replaced by
      # different content, but it collides with a known, unfixed BuildKit/ECR
      # interaction (moby/buildkit#3776, closed "not planned"): docker push
      # can register the tag successfully server-side and still exit non-zero
      # claiming the tag already exists, failing builds that actually
      # succeeded. Since IMAGE_TAG is always the commit SHA (buildspec.yml),
      # traceability doesn't depend on immutability -- a given SHA is only
      # ever pushed with the same content.
      ImageTagMutability: MUTABLE

      # Acceptance criterion: scan on push enabled.
      # ECR automatically runs a vulnerability scan (Basic Scanning,
      # based on the CVE database) on every "docker push".
      #
      # NOTE: if the account's registry is configured for "Enhanced
      # scanning" (Amazon Inspector), this per-repository setting is
      # ignored - the scan is then driven at the registry level by
      # AWS::ECR::RegistryScanningConfiguration (only one per account/region,
      # so it must be managed in a separate stack, not here).
      ImageScanningConfiguration:
        ScanOnPush: true

      # Encryption at rest for images. AES256 = key managed by AWS (free).
      # KMS would be the alternative for managing your own key (cost + rotation).
      EncryptionConfiguration:
        EncryptionType: AES256

      # Acceptance criterion: Lifecycle Policy.
      # Rule 1  : quickly expires untagged images (failed builds), otherwise
      #           they consume storage AND one of the N slots.
      # Rule 10 : keeps only the last N images.
      #           A "tagStatus: any" rule must always carry the HIGHEST
      #           rulePriority in the policy - hence the 10, which leaves
      #           room to insert intermediate rules.
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after ${UntaggedRetentionDays} day(s)",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedRetentionDays}
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 10,
                "description": "Keep only the last ${MaxImageCount} images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${MaxImageCount}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

      # Repository-level access policy (resource-based policy).
      #
      # Note: the "Allow" statement for the <account>:root principal does
      # not grant any additional rights beyond the account's identity-based
      # IAM policies (principals of the owning account are already
      # authorized via their IAM policy). It is only really necessary for
      # CROSS-ACCOUNT access. It is kept here to make the intent explicit.
      # The CodeBuild IAM role must in any case carry the same actions in
      # its identity-based policy, plus ecr:GetAuthorizationToken (an
      # account-level action that cannot be expressed in a resource policy).
      #
      # The "Deny" statement below, on the other hand, adds a real control:
      # it refuses any access that is not encrypted in transit.
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountPushPull
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:DescribeImages
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 'ecr:*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ------------------------------------------------------------------
# OUTPUTS
# Exported so they can be reused by other stacks (e.g. the CodeBuild
# stack needs RepositoryUri in its buildspec, and the IAM stack needs
# RepositoryArn to restrict its policies).
#
# Export names are unique per account/region. They are built from
# ProjectName + Environment (and NOT from ${AWS::StackName}) because
# that is the convention expected by the consuming stacks:
# codebuild.yaml and ecs-task-definition.yaml use
# !ImportValue '${ProjectName}-${Environment}-ecr-*'.
# Consequence: only one ECR stack per (project, environment) pair and
# per region - which is exactly the intent here.
# ------------------------------------------------------------------
Outputs:
  RepositoryUri:
    Description: Full repository URI (to use for "docker push")
    Value: !GetAtt AppRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-uri'

  RepositoryArn:
    Description: Repository ARN (used to restrict CodeBuild/ECS IAM policies)
    Value: !GetAtt AppRepository.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-arn'

  RepositoryName:
    Description: Name of the ECR repository
    Value: !Ref AppRepository
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-name'
