AWSTemplateFormatVersion: '2010-09-09'

# ------------------------------------------------------------------
# NOTE D'ENCODAGE
# Ce fichier est volontairement en ASCII pur (aucun accent, aucun
# caractere special). La console CloudFormation affichait "priv??"
# au lieu de "prive" : les octets UTF-8 des accents sont mal decodes
# dans le champ Description. Merci de ne PAS reintroduire d'accents
# dans les valeurs (Description, ParameterLabels, Outputs), sous peine
# de reproduire le probleme.
# ------------------------------------------------------------------

Description: >-
  Registre Amazon ECR prive (CI/CD AWS) - stocke les images Docker construites
  par CodeBuild. Scan on push active, chiffrement AES256, tags immuables.
  Lifecycle Policy : expire les images untagged puis ne conserve que les N
  dernieres images.

# ------------------------------------------------------------------
# INTERFACE CONSOLE
# Regroupe les parametres quand le template est deploye depuis la
# console CloudFormation (purement cosmetique).
# ------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Nommage
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: Cycle de vie des images
        Parameters:
          - MaxImageCount
          - UntaggedRetentionDays
    ParameterLabels:
      ProjectName:
        default: Nom du projet (minuscules)
      Environment:
        default: Environnement cible
      MaxImageCount:
        default: Nombre d'images a conserver
      UntaggedRetentionDays:
        default: Retention des images untagged (jours)

# ------------------------------------------------------------------
# PARAMETRES
# Permettent de reutiliser le meme template pour dev / staging / prod
# sans dupliquer le code (bonne pratique IaC).
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    Description: >-
      Nom du projet, utilise comme prefixe de nommage des ressources.
      Doit etre en minuscules (contrainte ECR).
    # Le motif interdit le tiret final et impose de commencer par une lettre.
    AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
    MinLength: 2
    MaxLength: 30
    ConstraintDescription: >-
      2 a 30 caracteres, minuscules / chiffres / tirets, doit commencer par
      une lettre et ne pas terminer par un tiret.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environnement cible. Impacte le nom du repository.

  MaxImageCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >-
      Nombre maximum d'images conservees par la Lifecycle Policy.
      Au-dela, les images les plus anciennes sont supprimees automatiquement.

  UntaggedRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 30
    Description: >-
      Duree de conservation des images sans tag (layers laisses par des
      builds echoues ou interrompus) avant expiration automatique.

# ------------------------------------------------------------------
# RESSOURCES
# ------------------------------------------------------------------
Resources:

  # Le repository ECR lui-meme.
  #
  # AWS::ECR::Repository cree TOUJOURS un registre PRIVE : il n'existe
  # aucune option "public" ici. Un registre public serait une ressource
  # d'un autre type (AWS::ECR::PublicRepository).
  AppRepository:
    Type: AWS::ECR::Repository

    # CloudFormation ne peut PAS supprimer un repository ECR non vide :
    # la suppression de stack echouerait en DELETE_FAILED des qu'une image
    # est presente. On retient donc explicitement la ressource, ce qui
    # protege aussi les artefacts en prod.
    # Pour un stack dev jetable : passer DeletionPolicy a "Delete" et
    # EmptyOnDelete a true ci-dessous.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}'

      # Explicite : ne pas vider le repository automatiquement a la
      # suppression (coherent avec DeletionPolicy: Retain).
      EmptyOnDelete: false

      # IMMUTABLE = un tag une fois pousse ne peut plus etre ecrase.
      # Bonne pratique CI/CD : evite qu'un SHA soit remplace silencieusement
      # par une autre image plus tard.
      #
      # /!\ CONSEQUENCE SUR LE PIPELINE : avec IMMUTABLE, un second
      # "docker push <repo>:latest" echoue avec ImageTagAlreadyExistsException.
      # Le buildspec doit donc tagger par SHA de commit / numero de build
      # (ex: :$CODEBUILD_RESOLVED_SOURCE_VERSION) et NE PAS republier "latest".
      # Si un tag mouvant "latest" est indispensable, repasser en MUTABLE.
      ImageTagMutability: IMMUTABLE

      # Critere d'acceptation : scan on push active.
      # ECR lance automatiquement un scan de vulnerabilites (Basic Scanning,
      # base sur la base CVE) a chaque "docker push".
      #
      # NOTE : si le registre du compte est configure en "Enhanced scanning"
      # (Amazon Inspector), ce reglage par repository est ignore - le scan
      # est alors pilote au niveau registre par
      # AWS::ECR::RegistryScanningConfiguration (une seule par compte/region,
      # donc a gerer dans un stack separe, pas ici).
      ImageScanningConfiguration:
        ScanOnPush: true

      # Chiffrement au repos des images. AES256 = cle geree par AWS (gratuit).
      # KMS serait l'alternative pour gerer sa propre cle (cout + rotation).
      EncryptionConfiguration:
        EncryptionType: AES256

      # Critere d'acceptation : Lifecycle Policy.
      # Regle 1  : expire vite les images untagged (builds echoues), sinon
      #            elles consomment du stockage ET un des N emplacements.
      # Regle 10 : ne conserve que les N dernieres images.
      #            Une regle "tagStatus: any" doit obligatoirement porter le
      #            rulePriority le PLUS ELEVE de la policy - d'ou le 10, qui
      #            laisse de la place pour inserer des regles intermediaires.
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expirer les images untagged apres ${UntaggedRetentionDays} jour(s)",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedRetentionDays}
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 10,
                "description": "Garder uniquement les ${MaxImageCount} dernieres images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${MaxImageCount}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

      # Politique d'acces au niveau du repository (resource-based policy).
      #
      # A savoir : le statement "Allow" au principal <account>:root ne donne
      # aucun droit supplementaire par rapport aux IAM policies identity-based
      # du compte (les principals du compte proprietaire sont deja autorises
      # via leur IAM policy). Il n'est reellement necessaire que pour un acces
      # CROSS-ACCOUNT. On le garde pour rendre l'intention explicite.
      # Le role IAM de CodeBuild doit de toute facon porter les memes actions
      # dans sa policy identity-based, plus ecr:GetAuthorizationToken (action
      # de niveau compte, non exprimable dans une resource policy).
      #
      # Le statement "Deny" ci-dessous, lui, ajoute un vrai controle :
      # il refuse tout acces non chiffre en transit.
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountPushPull
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:DescribeImages
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 'ecr:*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ------------------------------------------------------------------
# OUTPUTS
# Exportes pour etre reutilises par d'autres stacks (ex: la stack
# CodeBuild a besoin de RepositoryUri dans son buildspec, et la stack
# IAM a besoin de RepositoryArn pour restreindre les policies).
#
# Les noms d'export sont uniques par compte/region. On les construit a
# partir de ProjectName + Environment (et NON de ${AWS::StackName}) car
# c'est la convention attendue par les stacks consommatrices :
# codebuild.yaml et ecs-task-definition.yaml font
# !ImportValue '${ProjectName}-${Environment}-ecr-*'.
# Consequence : un seul stack ECR par couple (projet, environnement) et
# par region - ce qui est exactement l'intention ici.
# ------------------------------------------------------------------
Outputs:
  RepositoryUri:
    Description: URI complet du repository (a utiliser pour "docker push")
    Value: !GetAtt AppRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-uri'

  RepositoryArn:
    Description: ARN du repository (pour restreindre les IAM policies CodeBuild/ECS)
    Value: !GetAtt AppRepository.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-arn'

  RepositoryName:
    Description: Nom du repository ECR
    Value: !Ref AppRepository
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecr-name'
