AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Fargate task definition (bootstrap) + application log group for the
  project (AWS CI/CD). Extracted from pipeline.yml to keep the modular
  structure.
  This task definition is used ONLY for the first deployment (ContainerImage,
  "latest" by default). From the first pipeline run onward, the CodePipeline
  action "CodeDeployToECS" records new revisions (from taskdef.json +
  imageDetail.json produced by CodeBuild). This is expected and documented
  behavior of the ECS Blue/Green pattern, not a bug (see AWS:
  action-reference-ECSbluegreen).

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (see ecs-cluster.yaml):
#   ... 7. alb.yaml   8. ecs-task-definition.yaml   <- this stack   ...
#
# Also depends on 3. secrets-manager.yaml: the Secrets block below imports
# the secret ARNs. Without this stack, the deployment fails at the import step.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

  ContainerImage:
    Type: String
    Default: ''
    Description: >
      Full Docker image URI (for example: <account>.dkr.ecr.<region>.amazonaws.com/<repo>:latest).
      Leave empty to use the default '<RepositoryUri imported from ecr.yaml>:latest'
      (bootstrap). The pipeline (pipeline.yaml) overwrites this value at each
      deployment via taskdef.json generated by CodeBuild; this parameter only
      matters for the initial manual deployment of this stack.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port exposed by the container (see Dockerfile EXPOSE). Must match alb.yaml.

  ContainerCpu:
    Type: String
    Default: '256'
    Description: Fargate CPU (units). Must match the "cpu" value in taskdef.template.json.

  ContainerMemory:
    Type: String
    Default: '512'
    Description: Fargate memory (MB). Must match the "memory" value in taskdef.template.json.

  HealthCheckPath:
    Type: String
    Default: /health
    Description: Path used by the container health check (must match alb.yaml).

Conditions:
  UseDefaultImage: !Equals [!Ref ContainerImage, '']

Resources:

  # ==========================================================================
  # CLOUDWATCH LOG GROUP — container application logs (stdout/stderr)
  # ==========================================================================
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}'
      # 30-day retention: requirement F4 of the specifications.
      RetentionInDays: 30

  # ==========================================================================
  # TASK DEFINITION
  # ExecutionRoleArn / TaskRoleArn imported from iam.yaml: never duplicate
  # a role here (DRY principle already applied throughout the project).
  # Environment: non-sensitive application variables only — any secret
  # must go through Secrets/ARN in this same block (see Secrets
  # below), never in plaintext.
  # ==========================================================================
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-execution-role-arn'
      TaskRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-task-role-arn'
      ContainerDefinitions:
        - Name: app
          Image: !If
            - UseDefaultImage
            - !Sub
              - '${RepoUri}:latest'
              - RepoUri: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-ecr-uri'
            - !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # Non-sensitive environment variables for the application.
          # -> To add an application variable: add a Name/Value entry
          #    here (e.g. LOG_LEVEL, API_BASE_URL...).
          # -> For a SENSITIVE value (password, API key...), NEVER
          #    add it here in plaintext: use "Secrets:" instead, with a
          #    Secrets Manager ARN under ${ProjectName}/${Environment}/* (see
          #    the ReadAppSecrets policy already provided in iam.yaml,
          #    EcsTaskExecutionRole).
          Environment:
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
            # NODE_ENV is a technical value expected by Node/Express
            # ("production" enables view caching and hides
            # stack traces): it must NOT receive dev/staging/prod, otherwise
            # it would override the Dockerfile's `ENV NODE_ENV=production` and
            # the application would run in degraded mode all the way to production.
            - Name: NODE_ENV
              Value: production
            # The project's environment name is exposed separately.
            - Name: APP_ENV
              Value: !Ref Environment
          # ====================================================================
          # SECRETS (F3) — injected at container startup by the ECS agent,
          # which reads them from Secrets Manager using EcsTaskExecutionRole.
          #
          # They arrive inside the container as ordinary environment
          # variables, BUT their value is never stored in plaintext anywhere:
          # not in this template, not in taskdef.json, not in the CodeBuild
          # project's environment variables — only ARNs are passed around.
          # `aws ecs describe-task-definition` only returns the ARN, never the
          # value, unlike the Environment block above.
          #
          # Syntax "<arn>:<jsonKey>::": extracts ONE key from a JSON secret.
          # The 2 trailing empty fields are version-stage and version-id (not
          # specified = current version, AWSCURRENT).
          # ====================================================================
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${SecretArn}:username::'
                - SecretArn: !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
            # Plain-value secret (not JSON): the bare ARN is enough, no
            # key suffix needed.
            - Name: API_KEY
              ValueFrom: !ImportValue
                'Fn::Sub': '${ProjectName}-${Environment}-api-key-secret-arn'
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'wget --no-verbose --tries=1 --spider http://localhost:${ContainerPort}${HealthCheckPath} || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  TaskDefinitionArn:
    Description: ARN (with revision) of the bootstrap Task Definition
    Value: !Ref EcsTaskDefinition
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-taskdef-arn'

  TaskDefinitionFamily:
    Description: Task Definition family name (stable across revisions)
    Value: !Sub '${ProjectName}-${Environment}-task'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-taskdef-family'

  LogGroupName:
    Description: Name of the application CloudWatch log group
    Value: !Ref EcsLogGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-loggroup-name'
