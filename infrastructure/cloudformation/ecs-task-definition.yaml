AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Task Definition ECS Fargate (bootstrap) + Log Group applicatif pour le
  projet (CI/CD AWS). Extrait de pipeline.yml pour suivre la structure
  modulaire.
  Cette Task Definition sert UNIQUEMENT au premier déploiement (image
  ContainerImage, "latest" par défaut). À partir du premier passage du
  pipeline, c'est l'action CodePipeline "CodeDeployToECS" qui enregistre les
  nouvelles révisions (à partir de taskdef.json + imageDetail.json produits
  par CodeBuild) — cette dérive est un comportement ATTENDU et documenté du
  pattern ECS Blue/Green, pas un bug (voir AWS: action-reference-ECSbluegreen).

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DÉPLOIEMENT (voir ecs-cluster.yaml) :
#   ... 7. alb.yaml   8. ecs-task-definition.yaml   <- cette stack   ...
#
# Dépend aussi de 3. secrets-manager.yaml : le bloc Secrets ci-dessous importe
# les ARN des secrets. Sans cette stack, le déploiement échoue à l'import.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre à l'Environment des autres stacks.

  ContainerImage:
    Type: String
    Default: ''
    Description: >
      URI complète de l'image Docker (ex: <account>.dkr.ecr.<region>.amazonaws.com/<repo>:latest).
      Laisser vide pour utiliser par défaut '<RepositoryUri importé de ecr.yaml>:latest'
      (bootstrap). Le pipeline (pipeline.yaml) écrase cette valeur à chaque
      déploiement via taskdef.json généré par CodeBuild — ce paramètre ne
      compte donc que pour le déploiement initial manuel de cette stack.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port exposé par le conteneur (voir Dockerfile EXPOSE). Doit correspondre à alb.yaml.

  ContainerCpu:
    Type: String
    Default: '256'
    Description: CPU Fargate (unités). Doit correspondre à la valeur "cpu" de taskdef.template.json.

  ContainerMemory:
    Type: String
    Default: '512'
    Description: Mémoire Fargate (Mo). Doit correspondre à la valeur "memory" de taskdef.template.json.

  HealthCheckPath:
    Type: String
    Default: /health
    Description: Chemin utilisé par le health check du conteneur (doit correspondre à alb.yaml).

Conditions:
  UseDefaultImage: !Equals [!Ref ContainerImage, '']

Resources:

  # ==========================================================================
  # LOG GROUP CLOUDWATCH — logs applicatifs du conteneur (stdout/stderr)
  # ==========================================================================
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}'
      # Rétention 30 jours : F4 du cahier des charges.
      RetentionInDays: 30

  # ==========================================================================
  # TASK DEFINITION
  # ExecutionRoleArn / TaskRoleArn importés de iam.yaml : jamais de rôle
  # dupliqué ici (principe DRY déjà appliqué dans le reste du projet).
  # Environment : variables applicatives non sensibles uniquement — tout
  # secret doit passer par Secrets/ARN dans ce même bloc (voir Secrets
  # ci-dessous), jamais en clair.
  # ==========================================================================
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-execution-role-arn'
      TaskRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-task-role-arn'
      ContainerDefinitions:
        - Name: app
          Image: !If
            - UseDefaultImage
            - !Sub
              - '${RepoUri}:latest'
              - RepoUri: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-ecr-uri'
            - !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # Variables d'environnement non sensibles de l'application.
          # -> Pour ajouter une variable applicative : ajoute une entrée
          #    Name/Value ici (ex: LOG_LEVEL, API_BASE_URL...).
          # -> Pour une valeur SENSIBLE (mot de passe, clé API...), ne JAMAIS
          #    l'ajouter ici en clair : utilise plutôt "Secrets:" avec un ARN
          #    Secrets Manager sous ${ProjectName}/${Environment}/* (voir
          #    la policy ReadAppSecrets déjà prévue dans iam.yaml,
          #    EcsTaskExecutionRole).
          Environment:
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
            # NODE_ENV est une valeur technique attendue par Node/Express
            # ("production" active la mise en cache des vues et masque les
            # stacktraces) : elle ne doit PAS recevoir dev/staging/prod, sinon
            # elle écrase le `ENV NODE_ENV=production` du Dockerfile et
            # l'application tourne en mode dégradé jusqu'en production.
            - Name: NODE_ENV
              Value: production
            # Le nom de l'environnement du projet est exposé séparément.
            - Name: APP_ENV
              Value: !Ref Environment
          # ====================================================================
          # SECRETS (F3) — injectés au démarrage du conteneur par l'agent ECS,
          # qui les lit dans Secrets Manager avec EcsTaskExecutionRole.
          #
          # Ils arrivent dans le conteneur comme des variables d'environnement
          # classiques, MAIS leur valeur n'est stockée nulle part en clair :
          # ni dans ce template, ni dans taskdef.json, ni dans les variables
          # d'environnement du projet CodeBuild — seuls des ARN circulent.
          # `aws ecs describe-task-definition` ne renvoie que l'ARN, jamais la
          # valeur, contrairement au bloc Environment ci-dessus.
          #
          # Syntaxe "<arn>:<cléJson>::" : extrait UNE clé d'un secret JSON.
          # Les 2 champs vides finaux sont version-stage et version-id (non
          # précisés = version courante, AWSCURRENT).
          # ====================================================================
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${SecretArn}:username::'
                - SecretArn: !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
            # Secret à valeur simple (pas de JSON) : l'ARN nu suffit, sans
            # suffixe de clé.
            - Name: API_KEY
              ValueFrom: !ImportValue
                'Fn::Sub': '${ProjectName}-${Environment}-api-key-secret-arn'
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'wget --no-verbose --tries=1 --spider http://localhost:${ContainerPort}${HealthCheckPath} || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  TaskDefinitionArn:
    Description: ARN (avec révision) de la Task Definition bootstrap
    Value: !Ref EcsTaskDefinition
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-taskdef-arn'

  TaskDefinitionFamily:
    Description: Famille de la Task Definition (nom stable across révisions)
    Value: !Sub '${ProjectName}-${Environment}-task'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-taskdef-family'

  LogGroupName:
    Description: Nom du Log Group CloudWatch applicatif
    Value: !Ref EcsLogGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-loggroup-name'
