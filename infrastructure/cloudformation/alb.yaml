AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Public Application Load Balancer + 2 target groups (Blue/Green) + listeners
  for the project (AWS CI/CD). Extracted from pipeline.yml to keep the modular
  structure.
  - 2 target groups (Blue/Green): required by CodeDeploy for Blue/Green traffic
    shift (see pipeline.yaml, CodeDeployDeploymentGroup).
  - Production listener (80) + test listener (8080, CodeDeploy only).
  - HTTPS is not active yet (no domain/ACM certificate in dev), but the
    architecture is ready: see HttpsListener (Condition) below.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (voir ecs-cluster.yaml) :
#   ... 6. ecs-cluster.yaml   7. alb.yaml   <- cette stack   ...
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC ID (imported by convention from vpc.yaml in the other stacks;
      exposed here as an explicit parameter to respect the rule
      "no hardcoded ID"). Expected value: VpcId output from vpc.yaml.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Public subnets (minimum 2 AZs) where the ALB is placed. Expected value:
      PublicSubnetIds output from vpc.yaml.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port exposed by the application container (target of the target groups).

  HealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP path used by the target group health checks.

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN of an ACM certificate (optional). Leave empty in dev/staging.
      As soon as a domain is available, set this ARN to activate
      HttpsListener (see the HasCertificate condition below) without changing
      the template structure.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:

  # ==========================================================================
  # SECURITY GROUP DE L'ALB
  # Open to the public on 80 (prod) and 8080 (CodeDeploy test listener,
  # used ONLY during Blue/Green validation and never exposed to real users).
  # Port 443 is added conditionally when a certificate is provided.
  # ==========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'ALB - ${ProjectName}-${Environment}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Main HTTP traffic
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: CodeDeploy test listener
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Rule 443 is separate (not inline above) because SecurityGroupIngress does
  # not support a conditional block per entry. Only an entire resource can be
  # conditioned with Condition.
  AlbHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCertificate
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS traffic

  # ==========================================================================
  # APPLICATION LOAD BALANCER
  # ==========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # TARGET GROUPS BLUE/GREEN
  # TargetType "ip" is required for Fargate (no EC2 instance to target).
  # Both groups exist permanently: CodeDeploy switches production traffic from
  # one to the other on every deployment (see pipeline.yaml).
  # ==========================================================================
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue'
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # Faster Blue/Green rotation: no need to keep connections open for 5 min
        # (default) in a dev/staging environment.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg-green'
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # LISTENERS
  # ProdListener (80) routes by default to Blue; TestListener (8080) routes to
  # Green. CodeDeploy rewrites these DefaultActions on every deployment to
  # perform the traffic shift (native ECS Blue/Green behavior).
  # ==========================================================================
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  # ==========================================================================
  # HTTPS LISTENER (preparation for later)
  # Created only if CertificateArn is provided. Redirects to Blue by default,
  # like ProdListener. To enable it: redeploy this stack with the
  # CertificateArn parameter set; no other changes are required.
  # ==========================================================================
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

Outputs:

  LoadBalancerDnsName:
    Description: ALB DNS name (public entry point for the application)
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-dns'

  AlbFullName:
    Description: >
      Full name of the ALB (format 'app/name/id-generated-by-AWS') - required as
      a CloudWatch dimension (namespace AWS/ApplicationELB) by the observability
      stack.
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-full-name'

  AlbSecurityGroupId:
    Description: ALB security group ID (authorized source in ecs-service.yaml)
    Value: !GetAtt AlbSecurityGroup.GroupId
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-sg-id'

  BlueTargetGroupArn:
    Description: ARN of the Blue target group (used by ecs-service.yaml for the initial load balancer)
    Value: !Ref BlueTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-arn'

  GreenTargetGroupArn:
    Description: ARN of the Green target group
    Value: !Ref GreenTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-arn'

  BlueTargetGroupName:
    Description: Name of the Blue target group (required by CodeDeploy LoadBalancerInfo)
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-name'

  GreenTargetGroupName:
    Description: Name of the Green target group (required by CodeDeploy LoadBalancerInfo)
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-name'

  BlueTargetGroupFullName:
    Description: >
      Full name of the Blue target group - required for the CloudWatch metric
      dimension TargetGroup (HealthyHostCount).
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-full-name'

  GreenTargetGroupFullName:
    Description: Full name of the Green target group
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-full-name'

  ProdListenerArn:
    Description: ARN of the production listener (80) - required by CodeDeploy LoadBalancerInfo.ProdTrafficRoute
    Value: !Ref ProdListener
    Export:
      Name: !Sub '${ProjectName}-${Environment}-prod-listener-arn'

  TestListenerArn:
    Description: ARN of the test listener (8080) - required by CodeDeploy LoadBalancerInfo.TestTrafficRoute
    Value: !Ref TestListener
    Export:
      Name: !Sub '${ProjectName}-${Environment}-test-listener-arn'
