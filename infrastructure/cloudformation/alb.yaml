AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Application Load Balancer public + 2 Target Groups (Blue/Green) + listeners
  pour le projet (CI/CD AWS). Extrait de pipeline.yml pour suivre la structure
  modulaire.
  - 2 target groups (Blue/Green) : requis par CodeDeploy pour le traffic
    shift Blue/Green (voir pipeline.yaml, CodeDeployDeploymentGroup).
  - Listener prod (80) + listener de test (8080, CodeDeploy uniquement).
  - HTTPS non active pour l'instant (pas de domaine/certificat ACM en dev),
    mais l'architecture est prête : voir HttpsListener (Condition) plus bas.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (voir ecs-cluster.yaml) :
#   ... 6. ecs-cluster.yaml   7. alb.yaml   <- cette stack   ...
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre a l'Environment des autres stacks.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      ID du VPC (importe par convention depuis vpc.yaml dans les autres
      stacks ; expose ici comme parametre explicite pour respecter la regle
      "pas d'ID en dur"). Valeur attendue : sortie VpcId de vpc.yaml.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets publics (2 AZ minimum) où placer l'ALB. Valeur attendue :
      sortie PublicSubnetIds de vpc.yaml.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port expose par le conteneur applicatif (cible des target groups).

  HealthCheckPath:
    Type: String
    Default: /health
    Description: Chemin HTTP utilise par les health checks des target groups.

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN d'un certificat ACM (optionnel). Laisser vide en dev/staging.
      Des qu'un domaine est disponible, renseigner cet ARN pour activer
      HttpsListener (voir Condition HasCertificate ci-dessous) sans avoir
      a modifier la structure du template.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:

  # ==========================================================================
  # SECURITY GROUP DE L'ALB
  # Ouvert au public sur 80 (prod) et 8080 (listener de test CodeDeploy,
  # utilise UNIQUEMENT pendant la validation Blue/Green — jamais expose a de
  # vrais utilisateurs). Port 443 ajoute conditionnellement des qu'un
  # certificat est fourni.
  # ==========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'ALB - ${ProjectName}-${Environment}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Trafic prod (listener principal)
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: >
            Listener de test CodeDeploy (validation de la version Green
            avant le traffic shift) — a restreindre a un CIDR interne en
            production si l'acces public n'est pas souhaite.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Regle 443 separee (et non inline ci-dessus) car SecurityGroupIngress ne
  # supporte pas de bloc conditionnel par entree — seule une ressource
  # entiere peut être conditionnee avec Condition.
  AlbHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCertificate
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Trafic HTTPS (actif uniquement si CertificateArn est fourni)

  # ==========================================================================
  # APPLICATION LOAD BALANCER
  # ==========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # TARGET GROUPS BLUE/GREEN
  # TargetType "ip" obligatoire pour Fargate (pas d'instance EC2 a cibler).
  # Les deux groups existent en permanence : CodeDeploy bascule le trafic
  # prod de l'un vers l'autre a chaque deploiement (voir pipeline.yaml).
  # ==========================================================================
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue'
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # Cycle Blue/Green plus rapide : pas besoin de garder les connexions
        # ouvertes 5 min (defaut) sur un environnement dev/staging.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg-green'
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # LISTENERS
  # ProdListener (80) route par defaut vers Blue ; TestListener (8080) route
  # vers Green — CodeDeploy reecrit ces DefaultActions a chaque deploiement
  # pour effectuer le traffic shift (comportement natif Blue/Green ECS).
  # ==========================================================================
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  # ==========================================================================
  # LISTENER HTTPS (prepare pour plus tard)
  # Cree uniquement si CertificateArn est fourni. Redirige vers Blue par
  # defaut, comme ProdListener. Pour activer : redeployer cette stack avec
  # le parametre CertificateArn renseigne, aucune autre modification requise.
  # ==========================================================================
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

Outputs:

  LoadBalancerDnsName:
    Description: DNS de l'ALB (point d'entree public de l'application)
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-dns'

  AlbFullName:
    Description: >
      Nom "full name" de l'ALB (format 'app/nom/id-genere-par-AWS') — requis
      comme dimension CloudWatch (namespace AWS/ApplicationELB) par la stack
      d'observabilite.
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-full-name'

  AlbSecurityGroupId:
    Description: ID du security group de l'ALB (source autorisee dans ecs-service.yaml)
    Value: !GetAtt AlbSecurityGroup.GroupId
    Export:
      Name: !Sub '${ProjectName}-${Environment}-alb-sg-id'

  BlueTargetGroupArn:
    Description: ARN du target group Blue (utilise par ecs-service.yaml pour le LoadBalancer initial)
    Value: !Ref BlueTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-arn'

  GreenTargetGroupArn:
    Description: ARN du target group Green
    Value: !Ref GreenTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-arn'

  BlueTargetGroupName:
    Description: Nom du target group Blue (requis par CodeDeploy LoadBalancerInfo)
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-name'

  GreenTargetGroupName:
    Description: Nom du target group Green (requis par CodeDeploy LoadBalancerInfo)
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-name'

  BlueTargetGroupFullName:
    Description: >
      Nom "full name" du target group Blue — requis pour la dimension
      TargetGroup des metriques CloudWatch (HealthyHostCount).
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-blue-full-name'

  GreenTargetGroupFullName:
    Description: Nom "full name" du target group Green
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-tg-green-full-name'

  ProdListenerArn:
    Description: ARN du listener prod (80) — requis par CodeDeploy LoadBalancerInfo.ProdTrafficRoute
    Value: !Ref ProdListener
    Export:
      Name: !Sub '${ProjectName}-${Environment}-prod-listener-arn'

  TestListenerArn:
    Description: ARN du listener de test (8080) — requis par CodeDeploy LoadBalancerInfo.TestTrafficRoute
    Value: !Ref TestListener
    Export:
      Name: !Sub '${ProjectName}-${Environment}-test-listener-arn'
