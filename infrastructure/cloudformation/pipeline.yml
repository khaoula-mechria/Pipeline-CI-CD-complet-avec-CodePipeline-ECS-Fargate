AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CodePipeline + CodeDeploy Blue/Green pour le projet (CI/CD AWS).
  Assemble UNIQUEMENT l'orchestration CI/CD : ALB, cluster/service/task
  definition ECS ont été extraits dans des stacks dédiées (alb.yaml,
  ecs-cluster.yaml, ecs-service.yaml, ecs-task-definition.yaml) pour suivre
  une structure modulaire — cette stack les référence par Fn::ImportValue,
  elle ne recrée rien.
  - Bucket S3 d'artefacts + topic SNS + règle EventBridge de notification.
  - CodeDeploy Application + DeploymentGroup (Blue/Green, traffic shift
    progressif, rollback automatique sur échec) — voir "CHOIX Blue/Green"
    ci-dessous.
  - CodePipeline (Source GitHub -> Build CodeBuild -> Deploy CodeDeployToECS).

# ------------------------------------------------------------------
# CHOIX Blue/Green vs Rolling :
# On utilise AWS CodeDeploy pour un déploiement Blue/Green ECS plutôt qu'un
# déploiement rolling piloté directement par ECS (DeploymentController
# type ECS), parce que Blue/Green apporte deux garanties qu'un rolling
# update ECS natif n'a pas :
#   1. Bascule de trafic contrôlée et progressive (DeploymentConfigName
#      ECSLinear10PercentEvery1Minute) via un second listener/target group
#      (Green), au lieu de remplacer les tâches une à une derrière le même
#      target group.
#   2. Rollback automatique quasi instantané (AutoRollbackConfiguration sur
#      DEPLOYMENT_FAILURE) : si les nouvelles tâches échouent leurs health
#      checks pendant le traffic shift, CodeDeploy réoriente 100% du trafic
#      vers Blue (l'ancienne version) SANS jamais l'avoir coupée. Un rolling
#      update ECS classique aurait déjà commencé à terminer les anciennes
#      tâches à ce stade.
# Coût : une paire de target groups (alb.yaml) + un listener de test (8080)
# supplémentaires — acceptable pour la fiabilité gagnée sur un projet de
# portfolio DevOps qui veut démontrer ce pattern.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DÉPLOIEMENT (déjà documenté dans iam.yaml/ecs-cluster.yaml) :
#   1. vpc.yml   2. iam.yaml   3. secrets-manager.yaml   4. ecr.yaml
#   5. codebuild.yaml   6. ecs-cluster.yaml   7. alb.yaml
#   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml  <- cette stack (importe les exports des 9 stacks
#      précédentes ; ne crée plus l'ECS Fargate Service ni l'ALB elle-même)
#   11. observability.yml
#
# PRÉREQUIS AVANT DÉPLOIEMENT RÉEL :
#   - GitHubConnection (iam.yaml) doit être autorisée manuellement dans la
#     console AWS (Developer Tools > Connections) — sinon le stage Source
#     de ce pipeline reste bloqué en PENDING.
#   - Le repo GitHub pointé par FullRepositoryId doit contenir, à sa racine :
#     buildspec.yml, appspec.yaml, taskdef.template.json (voir task-manager/).
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre à l'Environment des autres stacks.

  FullRepositoryId:
    Type: String
    Default: ton-user/taskmanager
    Description: >
      Dépôt GitHub au format 'owner/repo', utilisé par le stage Source
      (action CodeStarSourceConnection). Doit être le même dépôt que
      GitHubRepoUrl dans codebuild.yaml.

  BranchName:
    Type: String
    Default: main
    Description: >
      Branche surveillée par ce pipeline. Volontairement une seule branche
      (main) : la validation build/test des branches feature/* est déjà
      couverte indépendamment par le webhook CodeBuild (codebuild.yaml,
      déclenché sur main OU develop) — pas besoin d'un second pipeline pour
      ça.

Resources:

  # ==========================================================================
  # BUCKET S3 D'ARTEFACTS DU PIPELINE
  # Nom EXACT attendu par CodePipelineServiceRole (iam.yaml, statement
  # PipelineArtifactsBucketAccess) : ne pas changer la convention de nommage
  # sans mettre à jour iam.yaml en conséquence. Versioning obligatoire : la
  # policy IAM autorise s3:GetBucketVersioning, et CodePipeline exige un
  # bucket versionné pour son ArtifactStore.
  # ==========================================================================
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # NOTIFICATIONS SNS (F4 du cahier des charges)
  # Nom préfixé ${ProjectName}-${Environment}- : convention attendue par
  # CodePipelineServiceRole (statement PublishPipelineNotifications) — cette
  # permission est réservée à un futur stage ManualApproval (CodePipeline
  # publie alors directement via son propre rôle). Les notifications de
  # changement d'état (SUCCESS/FAILED/...) implémentées ici passent par
  # EventBridge, qui a besoin de SA PROPRE permission de publication
  # (TopicPolicy ci-dessous), indépendante du rôle CodePipeline.
  # ==========================================================================
  PipelineNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-pipeline-notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PipelineNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PipelineNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PipelineStateChangeRule.Arn

  PipelineStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-state-change'
      Description: >
        Notifie PipelineNotificationsTopic à chaque changement d'état du
        pipeline (démarrage, succès, échec...) — F4 du cahier des charges.
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - 'CodePipeline Pipeline Execution State Change'
        detail:
          pipeline:
            - !Sub '${ProjectName}-${Environment}-pipeline'
          state:
            - STARTED
            - SUCCEEDED
            - FAILED
            - RESUMED
            - CANCELED
            - SUPERSEDED
      Targets:
        - Arn: !Ref PipelineNotificationsTopic
          Id: PipelineNotificationsTarget

  # ==========================================================================
  # CODEDEPLOY — APPLICATION + DEPLOYMENT GROUP (Blue/Green ECS)
  # ServiceRoleArn importé de iam.yaml (policy managée AWSCodeDeployRoleForECS,
  # cf. CodeDeployServiceRole). Cluster/service ECS et target groups/listeners
  # ALB importés des stacks dédiées (ecs-cluster.yaml, ecs-service.yaml,
  # alb.yaml) — plus aucune ressource réseau/compute recréée ici.
  # DeploymentConfigName ECSLinear10PercentEvery1Minute est l'équivalent
  # prédéfini AWS le plus proche du traffic shift F3 du cahier des charges
  # (10 % -> 100 % en ~10 min, palier toutes les minutes) — AWS ne propose
  # pas de config prédéfinie avec paliers 10/50/100 exacts.
  # ==========================================================================
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${ProjectName}-${Environment}-app'
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
      ServiceRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codedeploy-role-arn'
      DeploymentConfigName: CodeDeployDefault.ECSLinear10PercentEvery1Minute
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-name'
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-green-name'
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-prod-listener-arn'
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-test-listener-arn'
      ECSServices:
        - ClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          ServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      # Rollback automatique sur échec de déploiement (health checks ECS/ALB
      # qui échouent pendant le traffic shift) — critère US-03 / F3.
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ==========================================================================
  # CODEPIPELINE — Source (GitHub) -> Build (CodeBuild) -> Deploy (CodeDeployToECS)
  # ApplicationName/DeploymentGroupName référencés en dur via convention de
  # nommage (comme dans CodeDeployApplication/DeploymentGroup ci-dessus)
  # plutôt que par Ref, pour rester cohérent avec le reste du fichier et
  # éviter toute ambiguïté sur ce que Ref renvoie pour ces deux types de
  # ressources.
  # ==========================================================================
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - CodeDeployDeploymentGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline'
      RoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codepipeline-role-arn'
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-github-connection-arn'
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                # Convention de nommage codebuild.yaml : '${ProjectName}-${Environment}-build'.
                ProjectName: !Sub '${ProjectName}-${Environment}-build'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Sub '${ProjectName}-${Environment}-app'
                DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
                # taskdef.json est GÉNÉRÉ par buildspec.yml (ARN de rôles
                # injectés au build, cf. task-manager/taskdef.template.json)
                # -> vient de l'artefact de BUILD, pas de Source.
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: taskdef.json
                # appspec.yaml ne contient aucune valeur spécifique au compte
                # -> peut rester versionné tel quel dans le repo (Source).
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: BuildArtifact
                # Doit correspondre au placeholder <IMAGE1_NAME> utilisé
                # dans taskdef.template.json (champ "image" du conteneur).
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: BuildArtifact
              RunOrder: 1

Outputs:

  # Les 5 outputs ci-dessous sont des valeurs INFORMATIVES qui pointent vers
  # des exports désormais produits par alb.yaml/ecs-cluster.yaml/
  # ecs-service.yaml — SANS Export ici (le nom est déjà exporté par ces
  # stacks ; CloudFormation refuse qu'un même nom d'export existe deux fois).
  # observability.yaml importe ces mêmes noms directement depuis les
  # nouvelles stacks : aucune modification n'y est nécessaire.
  LoadBalancerDnsName:
    Description: DNS de l'ALB (point d'entrée public de l'application)
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-dns'

  AlbFullName:
    Description: >
      Nom "full name" de l'ALB — requis comme dimension CloudWatch par la
      stack d'observabilité (export d'origine : alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-full-name'

  BlueTargetGroupFullName:
    Description: >
      Nom "full name" du target group Blue — pour observability.yaml
      (dimension TargetGroup, HealthyHostCount ; export d'origine : alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-full-name'

  EcsClusterName:
    Description: "Nom du cluster ECS Fargate (export d'origine : ecs-cluster.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'

  EcsServiceName:
    Description: "Nom du service ECS Fargate (export d'origine : ecs-service.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'

  CodePipelineName:
    Description: Nom du pipeline CodePipeline
    Value: !Sub '${ProjectName}-${Environment}-pipeline'

  CodeDeployApplicationName:
    Description: Nom de l'application CodeDeploy
    Value: !Sub '${ProjectName}-${Environment}-app'

  CodeDeployDeploymentGroupName:
    Description: Nom du deployment group CodeDeploy
    Value: !Sub '${ProjectName}-${Environment}-dg'

  PipelineArtifactsBucketName:
    Description: Nom du bucket S3 d'artefacts du pipeline
    Value: !Ref PipelineArtifactsBucket

  PipelineNotificationsTopicArn:
    Description: ARN du topic SNS de notifications du pipeline
    Value: !Ref PipelineNotificationsTopic
    Export:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-notifications-arn'
