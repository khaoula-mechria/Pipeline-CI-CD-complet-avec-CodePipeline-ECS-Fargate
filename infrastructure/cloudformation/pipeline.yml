AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CodePipeline + CodeDeploy Blue/Green pour le projet (CI/CD AWS).
  Assemble UNIQUEMENT l'orchestration CI/CD : ALB, cluster/service/task
  definition ECS ont ete extraits dans des stacks dediees (alb.yaml,
  ecs-cluster.yaml, ecs-service.yaml, ecs-task-definition.yaml) pour suivre
  une structure modulaire - cette stack les reference par Fn::ImportValue,
  elle ne recree rien.
  - Bucket S3 d'artefacts + topic SNS + regle EventBridge de notification.
  - CodeDeploy Application + DeploymentGroup (Blue/Green, traffic shift
    progressif, rollback automatique sur echec) - voir "CHOIX Blue/Green"
    ci-dessous.
  - CodePipeline (Source GitHub -> Build CodeBuild -> Deploy CodeDeployToECS).

# ------------------------------------------------------------------
# CHOIX Blue/Green vs Rolling :
# On utilise AWS CodeDeploy pour un deploiement Blue/Green ECS plutôt qu'un
# deploiement rolling pilote directement par ECS (DeploymentController
# type ECS), parce que Blue/Green apporte deux garanties qu'un rolling
# update ECS natif n'a pas :
#   1. Bascule de trafic contrôlee et progressive (DeploymentConfigName
#      ECSLinear10PercentEvery1Minute) via un second listener/target group
#      (Green), au lieu de remplacer les taches une a une derriere le même
#      target group.
#   2. Rollback automatique quasi instantane (AutoRollbackConfiguration sur
#      DEPLOYMENT_FAILURE) : si les nouvelles taches echouent leurs health
#      checks pendant le traffic shift, CodeDeploy reoriente 100% du trafic
#      vers Blue (l'ancienne version) SANS jamais l'avoir coupee. Un rolling
#      update ECS classique aurait deja commence a terminer les anciennes
#      taches a ce stade.
# Coût : une paire de target groups (alb.yaml) + un listener de test (8080)
# supplementaires — acceptable pour la fiabilite gagnee sur un projet de
# portfolio DevOps qui veut demontrer ce pattern.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (deja documente dans iam.yaml/ecs-cluster.yaml) :
#   1. vpc.yml   2. iam.yaml   3. secrets-manager.yaml   4. ecr.yaml
#   5. codebuild.yaml   6. ecs-cluster.yaml   7. alb.yaml
#   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml  <- cette stack (importe les exports des 9 stacks
#      precedentes ; ne cree plus l'ECS Fargate Service ni l'ALB elle-même)
#   11. ecs-autoscaling.yaml   12. observability.yml
#
# Le topic SNS cree ici est consomme par les alarmes de ecs-autoscaling.yaml
# et de observability.yml — d'où leur position apres cette stack.
#
# PReREQUIS AVANT DePLOIEMENT ReEL :
#   - GitHubConnection (iam.yaml) doit être autorisee manuellement dans la
#     console AWS (Developer Tools > Connections) — sinon le stage Source
#     de ce pipeline reste bloque en PENDING.
#   - Le repo GitHub pointe par FullRepositoryId doit contenir, a sa racine :
#     buildspec.yml, appspec.yaml, taskdef.template.json (voir task-manager/).
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre a l'Environment des autres stacks.

  FullRepositoryId:
    Type: String
    Default: ton-user/taskmanager
    Description: >
      Depôt GitHub au format 'owner/repo', utilise par le stage Source
      (action CodeStarSourceConnection). Doit être le même depôt que
      GitHubRepoUrl dans codebuild.yaml.

  BranchName:
    Type: String
    Default: main
    Description: >
      Branche surveillee par ce pipeline. Volontairement une seule branche
      (main) : la validation build/test des branches feature/* est deja
      couverte independamment par le webhook CodeBuild (codebuild.yaml,
      declenche sur main OU develop) — pas besoin d'un second pipeline pour
      ça.

  EnableManualApproval:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Active le stage d'approbation manuelle entre Build et Deploy.
      a 'true' (defaut), le pipeline s'arrête apres le Build et attend une
      approbation humaine : c'est ce qui donne un etat "approval pending" a
      notifier (F4 du cahier des charges).
      TENSION ASSUMeE AVEC US-01 : cette user story (Must Have) demande que le
      deploiement soit declenche "sans intervention manuelle". Les deux
      exigences du CDC sont donc contradictoires par construction. Ce parametre
      permet de trancher par environnement plutôt que globalement : garder
      'true' en prod (garde-fou avant mise en production) et passer 'false' en
      dev/staging pour retrouver le deploiement 100 % automatique de US-01 et
      l'objectif de cycle < 10 min (§1.2).

Conditions:
  # Contrôle l'inclusion du stage Approval dans le pipeline (voir le parametre
  # EnableManualApproval ci-dessus).
  HasManualApproval: !Equals [!Ref EnableManualApproval, 'true']

Resources:

  # ==========================================================================
  # BUCKET S3 D'ARTEFACTS DU PIPELINE
  # Nom EXACT attendu par CodePipelineServiceRole (iam.yaml, statement
  # PipelineArtifactsBucketAccess) : ne pas changer la convention de nommage
  # sans mettre a jour iam.yaml en consequence. Versioning obligatoire : la
  # policy IAM autorise s3:GetBucketVersioning, et CodePipeline exige un
  # bucket versionne pour son ArtifactStore.
  # ==========================================================================
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # NOTIFICATIONS SNS (F4 du cahier des charges)
  # Nom prefixe ${ProjectName}-${Environment}- : convention attendue par
  # CodePipelineServiceRole (statement PublishPipelineNotifications) — cette
  # permission est reservee a un futur stage ManualApproval (CodePipeline
  # publie alors directement via son propre rôle). Les notifications de
  # changement d'etat (SUCCESS/FAILED/...) implementees ici passent par
  # EventBridge, qui a besoin de SA PROPRE permission de publication
  # (TopicPolicy ci-dessous), independante du rôle CodePipeline.
  # ==========================================================================
  PipelineNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-pipeline-notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PipelineNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PipelineNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PipelineStateChangeRule.Arn

  PipelineStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-state-change'
      Description: >
        Notifie PipelineNotificationsTopic a chaque changement d'etat du
        pipeline (demarrage, succes, echec...) — F4 du cahier des charges.
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - 'CodePipeline Pipeline Execution State Change'
        detail:
          pipeline:
            - !Sub '${ProjectName}-${Environment}-pipeline'
          state:
            - STARTED
            - SUCCEEDED
            - FAILED
            - RESUMED
            - CANCELED
            - SUPERSEDED
      Targets:
        - Arn: !Ref PipelineNotificationsTopic
          Id: PipelineNotificationsTarget

  # ==========================================================================
  # CODEDEPLOY — APPLICATION + DEPLOYMENT GROUP (Blue/Green ECS)
  # ServiceRoleArn importe de iam.yaml (policy managee AWSCodeDeployRoleForECS,
  # cf. CodeDeployServiceRole). Cluster/service ECS et target groups/listeners
  # ALB importes des stacks dediees (ecs-cluster.yaml, ecs-service.yaml,
  # alb.yaml) — plus aucune ressource reseau/compute recreee ici.
  # DeploymentConfigName ECSLinear10PercentEvery1Minute est l'equivalent
  # predefini AWS le plus proche du traffic shift F3 du cahier des charges
  # (10 % -> 100 % en ~10 min, palier toutes les minutes) — AWS ne propose
  # pas de config predefinie avec paliers 10/50/100 exacts.
  # ==========================================================================
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${ProjectName}-${Environment}-app'
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
      ServiceRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codedeploy-role-arn'
      DeploymentConfigName: CodeDeployDefault.ECSLinear10PercentEvery1Minute
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-name'
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-green-name'
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-prod-listener-arn'
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-test-listener-arn'
      ECSServices:
        - ClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          ServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      # Rollback automatique sur echec de deploiement (health checks ECS/ALB
      # qui echouent pendant le traffic shift) — critere US-03 / F3.
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ==========================================================================
  # CODEPIPELINE — Source (GitHub) -> Build (CodeBuild) -> Deploy (CodeDeployToECS)
  # ApplicationName/DeploymentGroupName references en dur via convention de
  # nommage (comme dans CodeDeployApplication/DeploymentGroup ci-dessus)
  # plutôt que par Ref, pour rester coherent avec le reste du fichier et
  # eviter toute ambiguïte sur ce que Ref renvoie pour ces deux types de
  # ressources.
  # ==========================================================================
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - CodeDeployDeploymentGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline'
      RoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codepipeline-role-arn'
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-github-connection-arn'
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                # Convention de nommage codebuild.yaml : '${ProjectName}-${Environment}-build'.
                ProjectName: !Sub '${ProjectName}-${Environment}-build'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # ====================================================================
        # STAGE APPROVAL (F4) — approbation humaine entre Build et Deploy.
        #
        # C'est ce stage qui cree l'etat "approval pending" que F4 demande de
        # notifier. Le mecanisme est natif : renseigner NotificationArn fait
        # publier par CodePipeline lui-même, sur le topic SNS, un message
        # contenant le lien d'approbation des que le pipeline se met en
        # attente. Aucune regle EventBridge supplementaire n'est necessaire —
        # et il n'y en aurait pas de satisfaisante, car "en attente
        # d'approbation" n'est pas un etat d'execution de pipeline : du point
        # de vue de CodePipeline l'execution reste simplement InProgress.
        #
        # Permissions : CodePipeline publie avec le rôle de service du
        # pipeline, qui porte deja sns:Publish (iam.yaml). Rien a ajouter dans
        # la policy du topic : en intra-compte, l'autorisation identity-based
        # suffit pour SNS.
        #
        # Le stage est CONDITIONNEL (parametre EnableManualApproval) : voir la
        # description de ce parametre pour la contradiction assumee avec US-01,
        # qui exige au contraire un deploiement "sans intervention manuelle".
        #
        # a SAVOIR : une approbation non traitee expire au bout de 7 jours
        # (limite AWS, non configurable) et l'execution passe alors en echec.
        # ====================================================================
        - !If
          - HasManualApproval
          - Name: Approval
            Actions:
              - Name: ManualApproval
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Provider: Manual
                  Version: '1'
                Configuration:
                  NotificationArn: !Ref PipelineNotificationsTopic
                  # Message affiche a l'approbateur dans la console et repris
                  # dans l'email SNS (140 caracteres maximum).
                  CustomData: !Sub >-
                    Deployer ${ProjectName} (${Environment}) en Blue/Green sur ECS Fargate ?
                    Build, tests, SAST et scan ECR sont deja passes.
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Sub '${ProjectName}-${Environment}-app'
                DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
                # taskdef.json est GeNeRe par buildspec.yml (ARN de rôles
                # injectes au build, cf. task-manager/taskdef.template.json)
                # -> vient de l'artefact de BUILD, pas de Source.
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: taskdef.json
                # appspec.yaml ne contient aucune valeur specifique au compte
                # -> peut rester versionne tel quel dans le repo (Source).
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: BuildArtifact
                # Doit correspondre au placeholder <IMAGE1_NAME> utilise
                # dans taskdef.template.json (champ "image" du conteneur).
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: BuildArtifact
              RunOrder: 1

Outputs:

  # Les 5 outputs ci-dessous sont des valeurs INFORMATIVES qui pointent vers
  # des exports desormais produits par alb.yaml/ecs-cluster.yaml/
  # ecs-service.yaml — SANS Export ici (le nom est deja exporte par ces
  # stacks ; CloudFormation refuse qu'un même nom d'export existe deux fois).
  # observability.yaml importe ces mêmes noms directement depuis les
  # nouvelles stacks : aucune modification n'y est necessaire.
  LoadBalancerDnsName:
    Description: DNS de l'ALB (point d'entree public de l'application)
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-dns'

  AlbFullName:
    Description: >
      Nom "full name" de l'ALB — requis comme dimension CloudWatch par la
      stack d'observabilite (export d'origine : alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-full-name'

  BlueTargetGroupFullName:
    Description: >
      Nom "full name" du target group Blue — pour observability.yaml
      (dimension TargetGroup, HealthyHostCount ; export d'origine : alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-full-name'

  EcsClusterName:
    Description: "Nom du cluster ECS Fargate (export d'origine : ecs-cluster.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'

  EcsServiceName:
    Description: "Nom du service ECS Fargate (export d'origine : ecs-service.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'

  CodePipelineName:
    Description: Nom du pipeline CodePipeline
    Value: !Sub '${ProjectName}-${Environment}-pipeline'

  CodeDeployApplicationName:
    Description: Nom de l'application CodeDeploy
    Value: !Sub '${ProjectName}-${Environment}-app'

  CodeDeployDeploymentGroupName:
    Description: Nom du deployment group CodeDeploy
    Value: !Sub '${ProjectName}-${Environment}-dg'

  PipelineArtifactsBucketName:
    Description: Nom du bucket S3 d'artefacts du pipeline
    Value: !Ref PipelineArtifactsBucket

  PipelineNotificationsTopicArn:
    Description: ARN du topic SNS de notifications du pipeline
    Value: !Ref PipelineNotificationsTopic
    Export:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-notifications-arn'
