AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CodePipeline + CodeDeploy Blue/Green for the project (AWS CI/CD).
  Assembles ONLY the CI/CD orchestration: the ALB, ECS cluster/service/task
  definition have been extracted into dedicated stacks (alb.yaml,
  ecs-cluster.yaml, ecs-service.yaml, ecs-task-definition.yaml) to keep a
  modular structure. This stack references them via Fn::ImportValue and does not
  recreate them.
  - S3 artifacts bucket + SNS topic + EventBridge notification rule.
  - CodeDeploy Application + DeploymentGroup (Blue/Green, gradual traffic shift,
    automatic rollback on failure) - see "Blue/Green choice" below.
  - CodePipeline (GitHub Source -> CodeBuild Build -> CodeDeployToECS Deploy).

# ------------------------------------------------------------------
# Blue/Green vs Rolling CHOICE:
# We use AWS CodeDeploy for a Blue/Green ECS deployment rather than a
# rolling deployment driven directly by ECS (DeploymentController
# type ECS), because Blue/Green provides two guarantees that a native
# ECS rolling update does not:
#   1. Controlled, progressive traffic shift (DeploymentConfigName
#      ECSLinear10PercentEvery1Minute) via a second listener/target group
#      (Green), instead of replacing tasks one by one behind the same
#      target group.
#   2. Near-instant automatic rollback (AutoRollbackConfiguration on
#      DEPLOYMENT_FAILURE): if the new tasks fail their health
#      checks during the traffic shift, CodeDeploy redirects 100% of the
#      traffic back to Blue (the previous version) WITHOUT ever having cut
#      it off. A classic ECS rolling update would already have started
#      terminating the old tasks at that point.
# Cost: an extra pair of target groups (alb.yaml) + a test listener (8080)
# — acceptable for the reliability gained on a DevOps portfolio
# project that wants to demonstrate this pattern.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (already documented in iam.yaml/ecs-cluster.yaml):
#   1. vpc.yml   2. secrets-manager.yaml   3. ecr.yaml   4. codebuild.yaml
#   5. iam.yaml   6. ecs-cluster.yaml   7. alb.yaml
#   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml  <- this stack (imports the exports of the 9
#      preceding stacks; no longer creates the ECS Fargate Service or the ALB itself)
#   11. ecs-autoscaling.yaml   12. observability.yml
#
# The SNS topic created here is consumed by the alarms in ecs-autoscaling.yaml
# and observability.yml — hence their position after this stack.
#
# PREREQUISITES BEFORE ACTUAL DEPLOYMENT:
#   - GitHubConnection (iam.yaml) must be authorized manually in the
#     AWS console (Developer Tools > Connections) — otherwise the Source stage
#     of this pipeline stays stuck in PENDING.
#   - The GitHub repo pointed to by FullRepositoryId must contain, at its root:
#     buildspec.yml, appspec.yaml, taskdef.template.json (see task-manager/).
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

  FullRepositoryId:
    Type: String
    Default: ton-user/taskmanager
    Description: >
      GitHub repository in 'owner/repo' format, used by the Source stage
      (CodeStarSourceConnection action). It must be the same repository as
      GitHubRepoUrl in codebuild.yaml.

  BranchName:
    Type: String
    Default: main
    Description: >
      Branch monitored by this pipeline. Intentionally only one branch (main):
      build/test validation for feature/* branches is already covered by
      .github/workflows/ci.yml (GitHub Actions), which runs on every
      feature/** push. codebuild.yaml's own webhook only fires on main/develop
      (a redundant standalone build, not a feature/* one) -- no second
      CodePipeline is needed here.

  EnableManualApproval:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Enables the manual approval stage between Build and Deploy.
      With 'true' (default), the pipeline stops after Build and waits for human
      approval: this creates the "approval pending" state to notify (F4 of the
      requirements).
      TENSION ASSUMED WITH US-01: this user story (Must Have) requires deployment
      to be triggered "without manual intervention". The two requirements in the
      functional specification are therefore inherently contradictory. This
      parameter allows the decision to be made per environment rather than
      globally: keep 'true' in prod (safety gate before production) and set it
      to 'false' in dev/staging to restore 100% automatic deployment for US-01
      and the <10 minute cycle goal (§1.2).

Conditions:
  # Controls whether the Approval stage is included in the pipeline (see the
  # EnableManualApproval parameter above).
  HasManualApproval: !Equals [!Ref EnableManualApproval, 'true']

Resources:

  # ==========================================================================
  # PIPELINE ARTIFACTS S3 BUCKET
  # EXACT name expected by CodePipelineServiceRole (iam.yaml, statement
  # PipelineArtifactsBucketAccess): do not change the naming convention
  # without updating iam.yaml accordingly. Versioning is mandatory: the
  # IAM policy allows s3:GetBucketVersioning, and CodePipeline requires a
  # versioned bucket for its ArtifactStore.
  # ==========================================================================
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # SNS NOTIFICATIONS (F4 of the requirements specification)
  # Name prefixed ${ProjectName}-${Environment}-: convention expected by
  # CodePipelineServiceRole (statement PublishPipelineNotifications) — this
  # permission is reserved for a future ManualApproval stage (CodePipeline
  # then publishes directly via its own role). The state change
  # notifications (SUCCESS/FAILED/...) implemented here go through
  # EventBridge, which needs ITS OWN publish permission
  # (TopicPolicy below), independent of the CodePipeline role.
  # ==========================================================================
  PipelineNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-pipeline-notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PipelineNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PipelineNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PipelineStateChangeRule.Arn

          # CloudWatch alarms (observability.yml, ecs-autoscaling.yaml) also
          # publish to this topic via AlarmActions/OKActions. A CloudWatch
          # alarm publishes as the cloudwatch.amazonaws.com service principal,
          # not through an IAM role -- without this statement, every alarm
          # transitions state correctly but its SNS publish is silently
          # rejected (AccessDenied logged internally, no visible pipeline
          # failure), so the F4 email notification never arrives. Scoped by
          # account rather than a single alarm ARN, since several unrelated
          # alarms across two stacks all publish here.
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationsTopic
            Condition:
              StringEquals:
                aws:SourceOwner: !Ref AWS::AccountId

  PipelineStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-state-change'
      Description: >
        Notifies PipelineNotificationsTopic on every pipeline state
        change (start, success, failure...) — F4 of the requirements specification.
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - 'CodePipeline Pipeline Execution State Change'
        detail:
          pipeline:
            - !Sub '${ProjectName}-${Environment}-pipeline'
          state:
            - STARTED
            - SUCCEEDED
            - FAILED
            - RESUMED
            - CANCELED
            - SUPERSEDED
      Targets:
        - Arn: !Ref PipelineNotificationsTopic
          Id: PipelineNotificationsTarget

  # ==========================================================================
  # CODEDEPLOY — APPLICATION + DEPLOYMENT GROUP (Blue/Green ECS)
  # ServiceRoleArn imported from iam.yaml (managed policy AWSCodeDeployRoleForECS,
  # see CodeDeployServiceRole). ECS cluster/service and ALB target
  # groups/listeners imported from dedicated stacks (ecs-cluster.yaml,
  # ecs-service.yaml, alb.yaml) — no network/compute resource is recreated here.
  # DeploymentConfigName ECSLinear10PercentEvery1Minute is the closest
  # predefined AWS equivalent to the F3 traffic shift requirement
  # (10% -> 100% in ~10 min, one step per minute) — AWS does not offer
  # a predefined config with exact 10/50/100 steps.
  # ==========================================================================
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${ProjectName}-${Environment}-app'
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
      ServiceRoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codedeploy-role-arn'
      DeploymentConfigName: CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-name'
              - Name: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-tg-green-name'
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-prod-listener-arn'
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-test-listener-arn'
      ECSServices:
        - ClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          ServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      # Automatic rollback on deployment failure (ECS/ALB health checks
      # failing during the traffic shift) — US-03 / F3 criterion.
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ==========================================================================
  # CODEPIPELINE — Source (GitHub) -> Build (CodeBuild) -> Deploy (CodeDeployToECS)
  # ApplicationName/DeploymentGroupName referenced hardcoded via the naming
  # convention (as in CodeDeployApplication/DeploymentGroup above)
  # rather than via Ref, to stay consistent with the rest of the file and
  # avoid any ambiguity about what Ref returns for these two resource
  # types.
  # ==========================================================================
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - CodeDeployDeploymentGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline'
      RoleArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-codepipeline-role-arn'
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-github-connection-arn'
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                # Naming convention from codebuild.yaml: '${ProjectName}-${Environment}-build'.
                ProjectName: !Sub '${ProjectName}-${Environment}-build'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # ====================================================================
        # APPROVAL STAGE (F4) — human approval between Build and Deploy.
        #
        # This is the stage that creates the "approval pending" state that F4
        # requires to be notified. The mechanism is native: setting
        # NotificationArn makes CodePipeline itself publish a message on the
        # SNS topic containing the approval link as soon as the pipeline
        # goes into a waiting state. No additional EventBridge rule is
        # needed — and none would be satisfactory anyway, since "pending
        # approval" is not a pipeline execution state: from CodePipeline's
        # point of view, the execution simply stays InProgress.
        #
        # Permissions: CodePipeline publishes using the pipeline's service
        # role, which already carries sns:Publish (iam.yaml). Nothing needs
        # to be added to the topic policy: within the same account, the
        # identity-based authorization is sufficient for SNS.
        #
        # The stage is CONDITIONAL (EnableManualApproval parameter): see the
        # description of that parameter for the assumed contradiction with
        # US-01, which instead requires a deployment "without manual
        # intervention".
        #
        # NOTE: an unprocessed approval expires after 7 days (AWS limit, not
        # configurable) and the execution then goes to failure.
        # ====================================================================
        - !If
          - HasManualApproval
          - Name: Approval
            Actions:
              - Name: ManualApproval
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Provider: Manual
                  Version: '1'
                Configuration:
                  NotificationArn: !Ref PipelineNotificationsTopic
                  # Message shown to the approver in the console and included
                  # in the SNS email (140 characters maximum).
                  CustomData: !Sub >-
                    Deploy ${ProjectName} (${Environment}) in Blue/Green on ECS Fargate?
                    Build, tests, SAST, and ECR scan have already passed.
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Sub '${ProjectName}-${Environment}-app'
                DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
                # taskdef.json is GENERATED by buildspec.yml (role ARNs
                # injected at build time, see task-manager/taskdef.template.json)
                # -> comes from the BUILD artifact, not Source.
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: taskdef.json
                # appspec.yaml contains no account-specific values
                # -> can stay versioned as-is in the repo (Source).
                AppSpecTemplateArtifact: SourceArtifact
                # SourceArtifact is the raw GitHub checkout with the repo's full
                # tree preserved (unlike BuildArtifact, which discard-paths
                # flattens) -- the file lives at task-manager/appspec.yaml, not
                # at the artifact root. Same bug class already hit and fixed for
                # BuildSpec in codebuild.yaml ("CodeBuild looked for the file at
                # the root and the build failed"); this is the Deploy-stage
                # equivalent, which would otherwise fail every single run right
                # after Source and Build both succeed.
                AppSpecTemplatePath: task-manager/appspec.yaml
                Image1ArtifactName: BuildArtifact
                # Must match the <IMAGE1_NAME> placeholder used
                # in taskdef.template.json (container "image" field).
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: BuildArtifact
              RunOrder: 1

Outputs:

  # The 5 outputs below are INFORMATIONAL values pointing to exports now produced
  # by alb.yaml / ecs-cluster.yaml / ecs-service.yaml - WITHOUT an export here
  # (the name is already exported by those stacks; CloudFormation rejects two
  # exports with the same name). observability.yaml imports these same names
  # directly from the new stacks: no change is required there.
  LoadBalancerDnsName:
    Description: ALB DNS name (public entry point for the application)
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-dns'

  AlbFullName:
    Description: >
      Full name of the ALB - required as a CloudWatch dimension by the
      observability stack (origin export: alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-alb-full-name'

  BlueTargetGroupFullName:
    Description: >
      Full name of the Blue target group - for observability.yaml
      (TargetGroup dimension, HealthyHostCount; origin export: alb.yaml).
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-full-name'

  EcsClusterName:
    Description: "Name of the ECS Fargate cluster (origin export: ecs-cluster.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'

  EcsServiceName:
    Description: "Name of the ECS Fargate service (origin export: ecs-service.yaml)"
    Value: !ImportValue
      'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'

  CodePipelineName:
    Description: Name of the CodePipeline pipeline
    Value: !Sub '${ProjectName}-${Environment}-pipeline'

  CodeDeployApplicationName:
    Description: Name of the CodeDeploy application
    Value: !Sub '${ProjectName}-${Environment}-app'

  CodeDeployDeploymentGroupName:
    Description: Name of the CodeDeploy deployment group
    Value: !Sub '${ProjectName}-${Environment}-dg'

  PipelineArtifactsBucketName:
    Description: Name of the S3 artifact bucket for the pipeline
    Value: !Ref PipelineArtifactsBucket

  PipelineNotificationsTopicArn:
    Description: ARN of the pipeline notification SNS topic
    Value: !Ref PipelineNotificationsTopic
    Export:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-notifications-arn'
