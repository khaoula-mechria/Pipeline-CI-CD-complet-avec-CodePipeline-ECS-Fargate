AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Service ECS Fargate pour le projet (CI/CD AWS). Extrait de pipeline.yml
  pour suivre la structure modulaire.
  - LaunchType FARGATE, DesiredCount configurable par parametre.
  - Reseau dans les subnets prives du VPC (pas d'IP publique — sortie via
    NAT Gateway, voir vpc.yaml).
  - Accepte le trafic UNIQUEMENT depuis l'ALB (security group dedie).
  - DeploymentController CODE_DEPLOY : c'est CodeDeploy (pipeline.yaml), pas
    ECS lui-meme, qui pilote le traffic shift Blue/Green a chaque
    deploiement - ECS ne fait que demarrer/arrêter les taches.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (voir ecs-cluster.yaml) :
#   ... 8. ecs-task-definition.yaml   9. ecs-service.yaml   <- cette stack
#   10. pipeline.yml   11. ecs-autoscaling.yaml   12. observability.yml
#
# L'auto scaling du nombre de taches est declare a part, dans
# ecs-autoscaling.yaml (deployee apres pipeline.yml car ses alarmes notifient
# le topic SNS cree la-bas) — voir la note sur DesiredCount ci-dessous.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre a l'Environment des autres stacks.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      ID du VPC. Valeur attendue : sortie VpcId de vpc.yaml. Utilise pour
      creer le security group du service dans le bon VPC.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets prives (2 AZ minimum) où placer les taches Fargate.
      Valeur attendue : sortie PrivateSubnetIds de vpc.yaml.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port expose par le conteneur. Doit correspondre a alb.yaml et ecs-task-definition.yaml.

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    Description: >
      Nombre de taches Fargate au DeMARRAGE (haute dispo sur 2 AZ).
      ATTENTION : depuis l'ajout de ecs-autoscaling.yaml, ce n'est plus la
      valeur qui fait autorite — c'est Application Auto Scaling qui possede
      DesiredCount une fois son ScalableTarget attache. Une mise a jour de
      CETTE stack peut le remettre transitoirement a cette valeur ;
      Application Auto Scaling le corrigera a sa prochaine evaluation (au
      minimum MinCapacity, puis selon le CPU reel). Pour changer durablement
      le nombre de taches, ajuster MinCapacity/MaxCapacity dans
      ecs-autoscaling.yaml, pas ce parametre.

Resources:

  # ==========================================================================
  # SECURITY GROUP DU SERVICE ECS
  # N'accepte du trafic entrant QUE depuis le security group de l'ALB
  # (importe de alb.yaml) — jamais directement depuis internet.
  # ==========================================================================
  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'ECS Service - ${ProjectName}-${Environment}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-alb-sg-id'
          Description: Trafic autorise UNIQUEMENT depuis l'ALB (Blue et Green)
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # SERVICE ECS FARGATE
  # LoadBalancers pointe vers le target group Blue au demarrage : c'est la
  # cible "initiale" attendue par CodeDeploy avant son premier deploiement
  # Blue/Green (voir pipeline.yaml, CodeDeployDeploymentGroup).
  # ==========================================================================
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-${Environment}-service'
      Cluster: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
      TaskDefinition: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-taskdef-arn'
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref EcsServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-arn'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  EcsServiceName:
    Description: Nom du service ECS Fargate (utilise par pipeline.yaml / observability.yaml)
    Value: !GetAtt EcsService.Name
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-name'

  EcsServiceArn:
    Description: ARN du service ECS Fargate
    Value: !Ref EcsService
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-arn'

  EcsServiceSecurityGroupId:
    Description: ID du security group du service ECS
    Value: !GetAtt EcsServiceSecurityGroup.GroupId
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-sg-id'
