AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Fargate service for the project (AWS CI/CD). Extracted from pipeline.yml to
  keep the modular structure.
  - LaunchType FARGATE, DesiredCount configurable by parameter.
  - Network in the private subnets of the VPC (no public IP - outgoing traffic via
    NAT Gateway, see vpc.yaml).
  - Accepts traffic ONLY from the ALB (dedicated security group).
  - DeploymentController CODE_DEPLOY: it is CodeDeploy (pipeline.yaml), not ECS
    itself, that controls the Blue/Green traffic shift at each deployment. ECS
    only starts and stops tasks.

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (see ecs-cluster.yaml):
#   ... 8. ecs-task-definition.yaml   9. ecs-service.yaml   <- this stack
#   10. pipeline.yml   11. ecs-autoscaling.yaml   12. observability.yml
#
# Auto scaling of the number of tasks is defined separately in
# ecs-autoscaling.yaml (deployed after pipeline.yml because its alarms notify the
# SNS topic created there) - see the DesiredCount note below.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC ID. Expected value: VpcId output from vpc.yaml. Used to create the
      service security group in the correct VPC.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Private subnets (minimum 2 AZs) where the Fargate tasks are placed.
      Expected value: PrivateSubnetIds output from vpc.yaml.

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port exposed by the container. Must match alb.yaml and ecs-task-definition.yaml.

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    Description: >
      Number of Fargate tasks at startup (high availability across 2 AZs).
      WARNING: since the addition of ecs-autoscaling.yaml, this is no longer the
      value that matters. Application Auto Scaling owns DesiredCount after its
      ScalableTarget is attached. Updating THIS stack may temporarily set it back
      to this value; Application Auto Scaling will correct it on the next
      evaluation (at least MinCapacity, then based on actual CPU). To change the
      number of tasks durably, adjust MinCapacity/MaxCapacity in
      ecs-autoscaling.yaml, not this parameter.

Resources:

  # ==========================================================================
  # ECS SERVICE SECURITY GROUP
  # Accepts inbound traffic ONLY from the ALB security group (imported from
  # alb.yaml) and never directly from the internet.
  # ==========================================================================
  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'ECS Service - ${ProjectName}-${Environment}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-alb-sg-id'
          Description: ALB to ECS traffic
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # ECS FARGATE SERVICE
  # LoadBalancers points to the Blue target group at startup: this is the
  # "initial" target expected by CodeDeploy before its first Blue/Green
  # deployment (see pipeline.yaml, CodeDeployDeploymentGroup).
  # ==========================================================================
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-${Environment}-service'
      Cluster: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
      TaskDefinition: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-ecs-taskdef-arn'
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref EcsServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-arn'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  EcsServiceName:
    Description: Name of the ECS Fargate service (used by pipeline.yaml / observability.yaml)
    Value: !GetAtt EcsService.Name
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-name'

  EcsServiceArn:
    Description: ARN of the ECS Fargate service
    Value: !Ref EcsService
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-arn'

  EcsServiceSecurityGroupId:
    Description: ID of the ECS service security group
    Value: !GetAtt EcsServiceSecurityGroup.GroupId
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-service-sg-id'
