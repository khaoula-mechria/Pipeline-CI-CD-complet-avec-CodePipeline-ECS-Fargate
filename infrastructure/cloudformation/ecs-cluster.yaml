AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Fargate cluster for the project (AWS CI/CD).
  Extracted from pipeline.yml to keep the modular structure: ecs-cluster.yaml
  contains ONLY the cluster itself (no tasks or services here; see
  ecs-task-definition.yaml and ecs-service.yaml). Container Insights is enabled
  for per-service CPU/memory/network monitoring (visible in the CloudWatch
  dashboard in observability.yml).

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (reference list for the project):
#   1. vpc.yml   2. secrets-manager.yaml   3. ecr.yaml   4. codebuild.yaml
#   5. iam.yaml
#   6. ecs-cluster.yaml   <- this stack
#   7. alb.yaml   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml   11. ecs-autoscaling.yaml   12. observability.yml
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

Resources:

  # ==========================================================================
  # ECS FARGATE CLUSTER
  # No EC2 instances to manage (Fargate = serverless): the cluster is only a
  # logical grouping of services and tasks. Container Insights provides detailed
  # metrics per service (CPU/memory/network/storage) in addition to the base
  # AWS/ECS metrics already used by the dashboard. It is explicitly enabled
  # because it is disabled by default on a new cluster.
  # ==========================================================================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${Environment}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  EcsClusterName:
    Description: Name of the ECS cluster (used by ecs-service.yaml and pipeline.yaml)
    Value: !Ref EcsCluster
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cluster-name'

  EcsClusterArn:
    Description: ARN of the ECS cluster
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cluster-arn'
