AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Cluster ECS Fargate pour le projet (CI/CD AWS).
  Extrait de pipeline.yml pour suivre la structure modulaire : ecs-cluster.yaml
  ne contient QUE le cluster lui-meme (aucune tache/service ici, voir
  ecs-task-definition.yaml et ecs-service.yaml). Container Insights active
  pour le monitoring CPU/Memoire/reseau par service (visible dans le
  dashboard CloudWatch de observability.yml).

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (liste de reference du projet) :
#   1. vpc.yml   2. iam.yaml   3. secrets-manager.yaml   4. ecr.yaml
#   5. codebuild.yaml
#   6. ecs-cluster.yaml   <- cette stack
#   7. alb.yaml   8. ecs-task-definition.yaml   9. ecs-service.yaml
#   10. pipeline.yml   11. ecs-autoscaling.yaml   12. observability.yml
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Doit correspondre au ProjectName des autres stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre a l'Environment des autres stacks.

Resources:

  # ==========================================================================
  # CLUSTER ECS FARGATE
  # Pas d'instances EC2 a gerer (Fargate = serverless) : le cluster n'est
  # qu'un regroupement logique de services/taches. ContainerInsights donne
  # des metriques detaillees par service (CPU/Memoire/reseau/stockage) en
  # plus des metriques de base AWS/ECS deja utilisees par le dashboard —
  # active explicitement car desactive par defaut sur un nouveau cluster.
  # ==========================================================================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${Environment}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:

  EcsClusterName:
    Description: Nom du cluster ECS (utilise par ecs-service.yaml et pipeline.yaml)
    Value: !Ref EcsCluster
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cluster-name'

  EcsClusterArn:
    Description: ARN du cluster ECS
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cluster-arn'
