AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Pipeline observability (EPIC CICD-EP-04 of the requirements):
  - Lambda that publishes 3 custom metrics (PipelineDuration, PipelineSuccess,
    PipelineFailure) at the end of each pipeline execution, triggered by a
    dedicated EventBridge rule (CodePipeline does not natively publish duration
    or success metrics to CloudWatch).
  - CloudWatch dashboard: pipeline metrics (custom), CodeBuild, ECS, and ALB.
  - 2 CloudWatch alarms (duration above threshold, pipeline failure) notifying
    the SNS topic already created in pipeline.yml.

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (see ecs-cluster.yaml for the full list
# of 12 stacks):
#   ... 10. pipeline.yml   11. ecs-autoscaling.yaml
#   12. observability.yml  <- this stack (imports the exports from
#      pipeline.yml: SNS topic, ECS names, ALB/target group)
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment of the other stacks.

  PipelineDurationThresholdSeconds:
    Type: Number
    Default: 900
    Description: >
      Alarm threshold for the pipeline duration, in seconds (F4 of the
      requirements: "alarm if the duration exceeds 15 minutes" -> 900s).

  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Optional email address to notify (US-04: "I receive an alert email").
      Leave empty to create no subscription - the SNS topic already exists
      (pipeline.yaml) and can be subscribed manually later (email, Slack via
      chatbot, etc.) without redeploying this stack.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  # ==========================================================================
  # LAMBDA — publishes the pipeline's custom metrics
  # CodePipeline does not natively publish duration/success metrics to
  # CloudWatch (unlike CodeBuild, which already publishes Duration/
  # SucceededBuilds/FailedBuilds in AWS/CodeBuild — retrieved directly
  # in the dashboard below, WITHOUT a Lambda). This function fills that gap,
  # specifically for CICD-TK-18 ("define the custom metrics").
  # ==========================================================================
  MetricsPublisherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-pipeline-metrics'
      RetentionInDays: 30

  MetricsPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-pipeline-metrics-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-pipeline-metrics-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt MetricsPublisherLogGroup.Arn
              - Sid: ReadPipelineExecutions
                Effect: Allow
                Action:
                  - codepipeline:ListPipelineExecutions
                Resource:
                  - !Sub 'arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-pipeline'
              - Sid: PublishCustomMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                # cloudwatch:PutMetricData does not accept an ARN-based
                # restriction (AWS constraint); scope limited via a Condition
                # on the namespace to prevent any unrelated publication.
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub '${ProjectName}/${Environment}/Pipeline'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  MetricsPublisherFunction:
    Type: AWS::Lambda::Function
    DependsOn: MetricsPublisherLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-pipeline-metrics'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MetricsPublisherRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          METRICS_NAMESPACE: !Sub '${ProjectName}/${Environment}/Pipeline'
      Code:
        ZipFile: |
          import os
          import boto3

          codepipeline = boto3.client("codepipeline")
          cloudwatch = boto3.client("cloudwatch")
          NAMESPACE = os.environ["METRICS_NAMESPACE"]


          def handler(event, context):
              detail = event["detail"]
              pipeline_name = detail["pipeline"]
              execution_id = detail["execution-id"]
              state = detail["state"]  # SUCCEEDED or FAILED

              metrics = [
                  {
                      "MetricName": "PipelineSuccess",
                      "Value": 1 if state == "SUCCEEDED" else 0,
                      "Unit": "Count",
                  },
                  {
                      "MetricName": "PipelineFailure",
                      "Value": 1 if state == "FAILED" else 0,
                      "Unit": "Count",
                  },
              ]

              # Duration = lastUpdateTime - startTime of THIS specific execution
              # (list_pipeline_executions is the only CodePipeline API that
              # exposes both of these timestamps together).
              try:
                  paginator = codepipeline.get_paginator("list_pipeline_executions")
                  for page in paginator.paginate(pipelineName=pipeline_name):
                      for execution in page.get("pipelineExecutionSummaries", []):
                          if execution.get("pipelineExecutionId") == execution_id:
                              start = execution["startTime"]
                              end = execution["lastUpdateTime"]
                              duration_seconds = (end - start).total_seconds()
                              metrics.append(
                                  {
                                      "MetricName": "PipelineDuration",
                                      "Value": duration_seconds,
                                      "Unit": "Seconds",
                                  }
                              )
                              break
              except Exception as exc:  # noqa: BLE001
                  print(f"Unable to compute the pipeline duration: {exc}")

              cloudwatch.put_metric_data(Namespace=NAMESPACE, MetricData=metrics)
              return {"status": "ok", "metricsPublished": len(metrics)}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  MetricsPublisherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetricsPublisherFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PipelineMetricsEventRule.Arn

  # Dedicated EventBridge rule (distinct from PipelineStateChangeRule in
  # pipeline.yaml, which targets the SNS topic): only reacts to the 2
  # "terminal" states (duration known), not to STARTED.
  PipelineMetricsEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-metrics-trigger'
      Description: Triggers the publication of the pipeline's custom metrics.
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - 'CodePipeline Pipeline Execution State Change'
        detail:
          pipeline:
            - !Sub '${ProjectName}-${Environment}-pipeline'
          state:
            - SUCCEEDED
            - FAILED
      Targets:
        - Arn: !GetAtt MetricsPublisherFunction.Arn
          Id: MetricsPublisherTarget

  # ==========================================================================
  # CLOUDWATCH ALARMS (CICD-TK-20) -> notify the SNS topic from pipeline.yaml
  # ==========================================================================
  PipelineDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-pipeline-duration-alarm'
      AlarmDescription: >
        Pipeline duration above the threshold (F4: 15 min by default). Based
        on the custom PipelineDuration metric (published by
        MetricsPublisherFunction at the end of each execution) — it can
        therefore only trigger AFTER the fact, not while a pipeline is
        still in progress.
      Namespace: !Sub '${ProjectName}/${Environment}/Pipeline'
      MetricName: PipelineDuration
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref PipelineDurationThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

  PipelineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-pipeline-failure-alarm'
      AlarmDescription: >
        At least one pipeline failure over the period — adds to the
        immediate SNS notification (EventBridge, pipeline.yaml) with an
        aggregated signal visible in CloudWatch/the dashboard.
      Namespace: !Sub '${ProjectName}/${Environment}/Pipeline'
      MetricName: PipelineFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

  # ==========================================================================
  # OPTIONAL EMAIL SUBSCRIPTION (US-04) on the existing SNS topic
  # ==========================================================================
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ==========================================================================
  # CLOUDWATCH DASHBOARD (CICD-TK-19) — US-04: average duration, success
  # rate (7-day rolling), number of deployments, + CodeBuild/ECS/ALB.
  # ==========================================================================
  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${Environment}-dashboard'
      # 2-argument form of Fn::Sub: a plain Fn::Sub can only resolve
      # Parameters/pseudo-parameters/Ref/GetAtt of THIS template — not
      # values imported from another stack. The map (2nd element of the
      # list) injects EcsClusterName/EcsServiceName/AlbFullName/
      # BlueTargetGroupFullName (all imported from pipeline.yaml) as
      # additional substitution variables.
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "text",
                "x": 0, "y": 0, "width": 24, "height": 1,
                "properties": {
                  "markdown": "# ${ProjectName} (${Environment}) — Pipeline CI/CD"
                }
              },
              {
                "type": "metric",
                "x": 0, "y": 1, "width": 8, "height": 6,
                "properties": {
                  "title": "Pipeline duration (s)",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "${ProjectName}/${Environment}/Pipeline", "PipelineDuration", { "stat": "Maximum" } ]
                  ],
                  "annotations": {
                    "horizontal": [
                      { "label": "Alarm threshold", "value": ${PipelineDurationThresholdSeconds} }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 8, "y": 1, "width": 8, "height": 6,
                "properties": {
                  "title": "Deployments (success vs failures)",
                  "view": "timeSeries",
                  "stacked": true,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "${ProjectName}/${Environment}/Pipeline", "PipelineSuccess", { "stat": "Sum", "label": "Success" } ],
                    [ "${ProjectName}/${Environment}/Pipeline", "PipelineFailure", { "stat": "Sum", "label": "Failures" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16, "y": 1, "width": 8, "height": 6,
                "properties": {
                  "title": "Success rate (7-day rolling, %)",
                  "view": "singleValue",
                  "region": "${AWS::Region}",
                  "period": 604800,
                  "metrics": [
                    [ "${ProjectName}/${Environment}/Pipeline", "PipelineSuccess", { "stat": "Sum", "id": "m1", "visible": false } ],
                    [ "${ProjectName}/${Environment}/Pipeline", "PipelineFailure", { "stat": "Sum", "id": "m2", "visible": false } ],
                    [ { "expression": "100*(m1/(m1+m2))", "label": "Success rate (%)", "id": "e1" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0, "y": 7, "width": 8, "height": 6,
                "properties": {
                  "title": "CodeBuild — build duration (s)",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/CodeBuild", "Duration", "ProjectName", "${ProjectName}-${Environment}-build", { "stat": "Average" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8, "y": 7, "width": 8, "height": 6,
                "properties": {
                  "title": "CodeBuild — succeeded / failed builds",
                  "view": "timeSeries",
                  "stacked": true,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/CodeBuild", "SucceededBuilds", "ProjectName", "${ProjectName}-${Environment}-build", { "stat": "Sum", "label": "Succeeded" } ],
                    [ "AWS/CodeBuild", "FailedBuilds", "ProjectName", "${ProjectName}-${Environment}-build", { "stat": "Sum", "label": "Failed" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16, "y": 7, "width": 8, "height": 6,
                "properties": {
                  "title": "ECS Fargate — CPU / Memory (%) and task count",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/ECS", "CPUUtilization", "ClusterName", "${EcsClusterName}", "ServiceName", "${EcsServiceName}", { "stat": "Average", "label": "CPU" } ],
                    [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${EcsClusterName}", "ServiceName", "${EcsServiceName}", { "stat": "Average", "label": "Memory" } ],
                    [ "ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${EcsClusterName}", "ServiceName", "${EcsServiceName}", { "stat": "Average", "label": "Running tasks", "yAxis": "right" } ]
                  ],
                  "annotations": {
                    "horizontal": [
                      { "label": "Auto scaling CPU target (70%)", "value": 70 }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 0, "y": 13, "width": 24, "height": 6,
                "properties": {
                  "title": "ALB — application latency (s) and healthy hosts (Blue target group)",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbFullName}", { "stat": "Average", "label": "Latency (p50)" } ],
                    [ "AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${AlbFullName}", "TargetGroup", "${BlueTargetGroupFullName}", { "stat": "Average", "label": "Healthy hosts (Blue)", "yAxis": "right" } ]
                  ]
                }
              }
            ]
          }
        - EcsClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          EcsServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
          AlbFullName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-alb-full-name'
          BlueTargetGroupFullName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-tg-blue-full-name'

Outputs:

  DashboardName:
    Description: Name of the CloudWatch dashboard
    Value: !Sub '${ProjectName}-${Environment}-dashboard'

  MetricsNamespace:
    Description: CloudWatch namespace for the custom pipeline metrics
    Value: !Sub '${ProjectName}/${Environment}/Pipeline'

  MetricsPublisherFunctionArn:
    Description: ARN of the Lambda function publishing the metrics
    Value: !GetAtt MetricsPublisherFunction.Arn
