AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS CodeBuild project for the project (AWS CI/CD).
  - Connects to the GitHub repository of the application (direct source, before
    the full CodePipeline setup).
  - Runs buildspec.yml: install -> SAST -> Docker build -> tests -> ECR push.
  - Triggered automatically by a GitHub webhook on push to main/develop.

# ------------------------------------------------------------------
# MANUAL PRE-REQUISITES (not possible in CloudFormation) :
#
# CodeBuild needs a GitHub authentication token stored once at the AWS account
# level before this stack can be deployed. Run this as soon as you have AWS
# access, before "aws cloudformation deploy":
#
#   aws codebuild import-source-credentials \
#     --server-type GITHUB \
#     --auth-type PERSONAL_ACCESS_TOKEN \
#     --token <YOUR_GITHUB_PERSONAL_ACCESS_TOKEN>
#
# (The GitHub token must have the "repo" + "admin:repo_hook" scope to let
# CodeBuild create the webhook automatically.)
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    Description: Must match the ProjectName used in ecr.yaml.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Must match the Environment used in ecr.yaml.

  GitHubRepoUrl:
    Type: String
    Description: >
      HTTPS URL of the GitHub repository for the application, for example:
      https://github.com/your-user/taskmanager-app.git

  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: >
      AWS managed image including Docker + Node.js + Python.
      standard:7.0 provides Node 18/20 natively.

Resources:

  # ------------------------------------------------------------------
  # IAM ROLE used by CodeBuild to run the build.
  # Principle of least privilege: only what is needed to push the image to the
  # specific ECR repository and write its logs.
  # ------------------------------------------------------------------
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codebuild-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Write build logs to CloudWatch Logs
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-${Environment}*'

              # ecr:GetAuthorizationToken must use Resource: "*" (AWS constraint;
              # this action does not accept repository ARN restrictions)
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

              # Push/pull restricted ONLY to the repository created in ecr.yaml
              # (import the exported ARN from the other stack -> no duplication,
              # no hardcoded value, consistent behavior across both stacks)
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-ecr-arn'

              # US-05: buildspec.yml reads the ECR scan result after the push
              # (triggered by ScanOnPush, see ecr.yaml) to block on CRITICAL and
              # notify on HIGH. Without this permission, the
              # describe-image-scan-findings call fails and the build stops in
              # fail-safe mode.
              - Sid: EcrReadScanFindings
                Effect: Allow
                Action:
                  - ecr:DescribeImageScanFindings
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-ecr-arn'

              # US-05: SNS notification for the scan result (blocking on
              # CRITICAL, informational on HIGH).
              #
              # ARN is built by naming convention instead of importing from
              # pipeline.yml: this stack deploys in 5th position, well BEFORE
              # pipeline.yml (10th), which creates the topic. Using Fn::ImportValue
              # would create a circular dependency in deployment order. The topic
              # name is deterministic (TopicName in pipeline.yml), and an SNS ARN
              # has no random suffix, unlike Secrets Manager: the convention is
              # therefore reliable here.
              - Sid: PublishScanNotifications
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-pipeline-notifications'

  # ------------------------------------------------------------------
  # CLOUDWATCH LOG GROUP FOR BUILDS
  #
  # F4 of the requirements: "build and application logs are centralized in
  # CloudWatch Logs with a 30-day retention period".
  #
  # Declared explicitly here, not left to automatic creation by CodeBuild: a
  # log group created implicitly at the first build has a retention of
  # "Never expire" (logs accumulate indefinitely and cost money). This was the
  # case before 2026-07-28; LogsConfig only set the group name without creating
  # the resource.
  #
  # NOTE FOR DEPLOYMENT TO AN EXISTING STACK: if builds have already run,
  # CodeBuild may have created this log group automatically and CloudFormation
  # will fail with "already exists". In that case, either delete it first
  # (`aws logs delete-log-group`), or import it into the stack. On a first
  # deployment, there is nothing to do.
  # ------------------------------------------------------------------
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ProjectName}-${Environment}'
      # Retention is 30 days: F4 of the requirements (same value as the ECS
      # application log group in ecs-task-definition.yaml).
      RetentionInDays: 30

  # ------------------------------------------------------------------
  # CODEBUILD PROJECT
  # ------------------------------------------------------------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-build'
      Description: !Sub 'Build, tests, and Docker image for ${ProjectName} (${Environment})'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn

      # Source directly connected to the GitHub repository (acceptance criterion).
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        # Path resolved from the ROOT of the cloned repository, not from a
        # subdirectory: the application lives in task-manager/, so the buildspec
        # must include its prefix. With the previous value ("buildspec.yml"),
        # CodeBuild looked for the file at the root and the build failed before
        # the install phase even started.
        BuildSpec: task-manager/buildspec.yml
        GitCloneDepth: 1
        ReportBuildStatus: true

      # Automatic trigger by webhook: push to main OR develop.
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: '^refs/heads/(main|develop)$'

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        # PrivilegedMode is REQUIRED: without it, "docker build" inside
        # CodeBuild fails (no access to the Docker daemon).
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-ecr-uri'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          # Used by buildspec.yml to generate taskdef.json dynamically
          # (ECS role ARNs = ${ProjectName}-${Environment}-ecs-*-role, by naming
          # convention - see iam.yaml) without hardcoding them.
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ENVIRONMENT_NAME
            Value: !Ref Environment
          # Application secret ARNs are injected into taskdef.json by
          # buildspec.yml (Secrets block of the task definition).
          #
          # A secret ARN is NOT sensitive data: it is an identifier. F3 forbids
          # CLEAR secret values in CodeBuild environment variables - this is
          # exactly what this mechanism avoids: only the ARN passes here; the
          # value is read by the ECS agent when the task starts.
          #
          # Imported from secrets-manager.yaml because the ARN ends with a random
          # 6-character suffix added by AWS: it cannot be recreated by naming
          # convention.
          - Name: DB_SECRET_ARN
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
          - Name: API_KEY_SECRET_ARN
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-api-key-secret-arn'
          # Notification topic for the pipeline, used by buildspec.yml to publish
          # the ECR scan result (US-05). It is constructed by naming convention
          # and NOT imported from pipeline.yml: see the justification in the
          # IAM statement PublishScanNotifications above (this stack deploys
          # before the one that creates the topic).
          - Name: PIPELINE_NOTIFICATIONS_TOPIC_ARN
            Value: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-pipeline-notifications'

      # No S3 artifact: the build output is the image pushed to ECR directly in
      # buildspec.yml (post_build).
      Artifacts:
        Type: NO_ARTIFACTS

      # Cache of npm dependencies between builds -> faster builds.
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          # !Ref on an AWS::Logs::LogGroup returns its NAME - exactly what
          # GroupName expects. Using the reference instead of a !Sub duplicate
          # avoids creating an extra CloudFormation dependency: the log group (with
          # retention) is guaranteed to be created before the project.
          GroupName: !Ref BuildLogGroup

      TimeoutInMinutes: 15

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ProjectName:
    Description: Name of the CodeBuild project (useful to trigger it manually while waiting for CodePipeline)
    Value: !Ref BuildProject

  ProjectArn:
    Description: ARN of the CodeBuild project
    Value: !GetAtt BuildProject.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codebuild-arn'

  ServiceRoleArn:
    Description: ARN of the IAM role used by CodeBuild
    Value: !GetAtt CodeBuildServiceRole.Arn

  BuildLogGroupName:
    Description: Name of the CloudWatch build log group (30-day retention)
    Value: !Ref BuildLogGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codebuild-loggroup-name'
