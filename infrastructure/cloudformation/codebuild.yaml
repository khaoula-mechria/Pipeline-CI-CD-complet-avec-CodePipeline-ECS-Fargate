AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Projet AWS CodeBuild pour le projet PFE (CI/CD AWS).
  - Lié au dépôt GitHub de l'application (source directe, avant mise en place
    complète de CodePipeline).
  - Exécute buildspec.yml : install -> SAST -> build Docker -> tests -> push ECR.
  - Déclenché automatiquement par un webhook GitHub sur push vers main/develop.

# ------------------------------------------------------------------
# PRÉREQUIS MANUELS (impossibles à faire en CloudFormation) :
#
# CodeBuild a besoin d'un token d'authentification GitHub stocké UNE FOIS
# au niveau du compte AWS avant de pouvoir déployer cette stack. À lancer
# dès que tu as l'accès AWS, avant "aws cloudformation deploy" :
#
#   aws codebuild import-source-credentials \
#     --server-type GITHUB \
#     --auth-type PERSONAL_ACCESS_TOKEN \
#     --token <TON_GITHUB_PERSONAL_ACCESS_TOKEN>
#
# (Le token GitHub doit avoir le scope "repo" + "admin:repo_hook" pour
# permettre à CodeBuild de créer le webhook automatiquement.)
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    Description: Doit correspondre au ProjectName utilisé dans ecr.yaml.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Doit correspondre à l'Environment utilisé dans ecr.yaml.

  GitHubRepoUrl:
    Type: String
    Description: >
      URL HTTPS du dépôt GitHub de l'application, ex:
      https://github.com/ton-user/taskmanager-app.git

  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: >
      Image managée AWS incluant Docker + Node.js + Python.
      standard:7.0 fournit Node 18/20 nativement.

Resources:

  # ------------------------------------------------------------------
  # RÔLE IAM utilisé PAR CodeBuild pour exécuter le build.
  # Principe du moindre privilège : uniquement ce qui est nécessaire
  # pour push l'image vers CE repository ECR précis + écrire ses logs.
  # ------------------------------------------------------------------
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codebuild-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Écriture des logs de build dans CloudWatch Logs
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-${Environment}*'

              # ecr:GetAuthorizationToken doit être Resource: "*" (contrainte AWS,
              # cette action n'accepte pas de restriction par ARN de repository)
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

              # Push/pull restreint UNIQUEMENT au repository créé dans ecr.yaml
              # (import de l'ARN exporté par l'autre stack -> pas de duplication,
              # pas de valeur en dur, cohérence garantie entre les deux stacks)
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-ecr-arn'

              # US-05 : buildspec.yml lit le résultat du scan ECR après le push
              # (déclenché par ScanOnPush, cf. ecr.yaml) pour bloquer sur
              # CRITICAL et notifier sur HIGH. Sans cette permission, l'appel
              # describe-image-scan-findings échoue et le build s'arrête en
              # fail-safe.
              - Sid: EcrReadScanFindings
                Effect: Allow
                Action:
                  - ecr:DescribeImageScanFindings
                Resource:
                  - !ImportValue
                    'Fn::Sub': '${ProjectName}-${Environment}-ecr-arn'

              # US-05 : notification SNS du résultat du scan (bloquant sur
              # CRITICAL, informatif sur HIGH).
              #
              # ARN construit par convention de nommage plutôt qu'importé de
              # pipeline.yml : cette stack se déploie en 5e position, bien AVANT
              # pipeline.yml (10e) qui crée le topic. Un Fn::ImportValue créerait
              # une dépendance circulaire dans l'ordre de déploiement. Le nom du
              # topic est déterministe (TopicName dans pipeline.yml) et un ARN
              # SNS n'a pas de suffixe aléatoire, contrairement à Secrets
              # Manager : la convention est donc fiable ici.
              - Sid: PublishScanNotifications
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-pipeline-notifications'

  # ------------------------------------------------------------------
  # PROJET CODEBUILD
  # ------------------------------------------------------------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-build'
      Description: !Sub 'Build, tests et image Docker pour ${ProjectName} (${Environment})'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn

      # Source directement liée au dépôt GitHub (critère d'acceptation).
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        # Chemin résolu depuis la RACINE du dépôt cloné, pas depuis un
        # sous-répertoire : l'application vit dans task-manager/, donc le
        # buildspec doit être désigné avec son préfixe. Avec la valeur
        # précédente ("buildspec.yml"), CodeBuild cherchait le fichier à la
        # racine et le build échouait avant même la phase install.
        BuildSpec: task-manager/buildspec.yml
        GitCloneDepth: 1
        ReportBuildStatus: true

      # Déclenchement automatique par webhook : push sur main OU develop.
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: '^refs/heads/(main|develop)$'

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        # PrivilegedMode est OBLIGATOIRE : sans lui, "docker build" à
        # l'intérieur de CodeBuild échoue (pas d'accès au démon Docker).
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-ecr-uri'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          # Utilisées par buildspec.yml pour générer dynamiquement taskdef.json
          # (ARN des rôles ECS = ${ProjectName}-${Environment}-ecs-*-role, par
          # convention de nommage — voir iam.yaml) sans les coder en dur.
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ENVIRONMENT_NAME
            Value: !Ref Environment
          # ARN des secrets applicatifs, injectés dans taskdef.json par
          # buildspec.yml (bloc "secrets" de la task definition).
          #
          # Un ARN de secret n'est PAS une donnée sensible : c'est un
          # identifiant. F3 interdit les VALEURS de secrets en clair dans les
          # variables d'environnement CodeBuild — c'est justement ce que ce
          # mécanisme évite : seul l'ARN transite ici, la valeur est lue par
          # l'agent ECS au démarrage de la tâche.
          #
          # Importés depuis secrets-manager.yaml car l'ARN se termine par un
          # suffixe aléatoire de 6 caractères ajouté par AWS : impossible de
          # le reconstruire par convention de nommage.
          - Name: DB_SECRET_ARN
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-db-secret-arn'
          - Name: API_KEY_SECRET_ARN
            Value: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-api-key-secret-arn'
          # Topic de notification du pipeline, utilisé par buildspec.yml pour
          # publier le résultat du scan ECR (US-05). Construit par convention
          # de nommage et NON importé de pipeline.yml : voir la justification
          # sur le statement IAM PublishScanNotifications ci-dessus (cette
          # stack se déploie avant celle qui crée le topic).
          - Name: PIPELINE_NOTIFICATIONS_TOPIC_ARN
            Value: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-pipeline-notifications'

      # Pas d'artefact S3 : le "livrable" du build est l'image poussée
      # vers ECR directement dans buildspec.yml (post_build).
      Artifacts:
        Type: NO_ARTIFACTS

      # Cache des dépendances npm entre builds -> builds plus rapides.
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/${ProjectName}-${Environment}'

      TimeoutInMinutes: 15

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ProjectName:
    Description: Nom du projet CodeBuild (utile pour le déclencher manuellement en attendant CodePipeline)
    Value: !Ref BuildProject

  ProjectArn:
    Description: ARN du projet CodeBuild
    Value: !GetAtt BuildProject.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-codebuild-arn'

  ServiceRoleArn:
    Description: ARN du rôle IAM utilisé par CodeBuild
    Value: !GetAtt CodeBuildServiceRole.Arn
