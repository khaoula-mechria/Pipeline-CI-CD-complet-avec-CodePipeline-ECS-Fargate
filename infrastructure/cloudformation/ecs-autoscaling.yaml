AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Auto Scaling for the ECS Fargate service (Application Auto Scaling) for the
  project (AWS CI/CD).
  F3 of the requirements: "The number of Fargate tasks scales automatically
  according to CPU load (HPA-like via Application Auto Scaling)".
  - ScalableTarget on ecs:service:DesiredCount (min/max configurable).
  - Target Tracking ScalingPolicy on the average CPU of the service
    (target 70% by default).
  - 2 CloudWatch observability alarms (sustained CPU, maximum capacity reached)
    notifying the pipeline SNS topic. They do NOT control scaling (see the note
    below): they warn the team.

# ------------------------------------------------------------------
# NOTE ON DEPLOYMENT ORDER (see ecs-cluster.yaml):
#   ... 9. ecs-service.yaml   10. pipeline.yml
#   11. ecs-autoscaling.yaml   <- this stack
#   12. observability.yml
#
# Must be deployed AFTER ecs-service.yaml (the ScalableTarget attaches to a
# service that must already exist) AND AFTER pipeline.yml (the alarms notify
# the SNS topic created there).
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# TWO IMPORTANT POINTS TO UNDERSTAND BEFORE MODIFYING THIS TEMPLATE
#
# 1) Target Tracking creates ITS OWN CloudWatch alarms, invisible here.
#    Application Auto Scaling automatically manages a pair of alarms
#    (named "TargetTracking-service/...") to trigger scale-out and
#    scale-in. The 2 alarms defined further down in this template are
#    therefore NOT used to scale: they exist to WARN the team (F4). Do not
#    delete them thinking it will break scaling, and do not wire them to a
#    ScalingPolicy — that would be redundant and a source of conflicts.
#
# 2) DesiredCount from ecs-service.yaml becomes an INITIAL value only.
#    As soon as this ScalableTarget is attached, Application Auto Scaling
#    owns DesiredCount. An update to the ecs-service.yaml stack can
#    transiently reset it to its parameter value (2 by default):
#    Application Auto Scaling will correct it at the next evaluation (it
#    applies at minimum MinCapacity, then adjusts based on actual CPU).
#    This is a known behavior of CloudFormation + Application Auto Scaling,
#    not a bug in these templates.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# PARAMETERS
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment of the other stacks.

  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    Description: >
      Minimum number of Fargate tasks. Keep >= 2 to remain distributed across
      2 AZs (consistent with the default DesiredCount in ecs-service.yaml).

  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 1
    Description: >
      Maximum number of Fargate tasks. This is both a cost and load ceiling:
      6 tasks at 256 CPU / 512 MB remain modest.

  TargetCpuUtilization:
    Type: Number
    Default: 70
    MinValue: 10
    MaxValue: 90
    Description: >
      Average CPU target for the service, in percent (F3: 70%). Application
      Auto Scaling adds or removes tasks to maintain this average.

  ScaleOutCooldown:
    Type: Number
    Default: 60
    MinValue: 0
    Description: >
      Delay (s) before a new scale-out. Intentionally short: it is better to
      react quickly to rising load.

  ScaleInCooldown:
    Type: Number
    Default: 300
    MinValue: 0
    Description: >
      Delay (s) before a new scale-in. Intentionally longer than scale-out to
      avoid flapping when the load oscillates.

  HighCpuAlarmThreshold:
    Type: Number
    Default: 85
    MinValue: 10
    MaxValue: 100
    Description: >
      Threshold (%) for the observability CPU alarm. Keep it ABOVE
      TargetCpuUtilization: reaching the target is normal; exceeding it
      significantly and for a sustained period means scaling is not keeping up.

# ------------------------------------------------------------------
# RESOURCES
# ------------------------------------------------------------------
Resources:

  # ==========================================================================
  # SCALABLE TARGET — declares WHAT can scale and within which bounds.
  #
  # No RoleARN: Application Auto Scaling automatically uses the role
  # linked to the service (AWSServiceRoleForApplicationAutoScaling_ECSService),
  # created by AWS on first use. This is why iam.yaml did NOT need ANY
  # modification for this feature.
  # ==========================================================================
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: 'ecs:service:DesiredCount'
      # Format imposed by ECS: service/<cluster name>/<service name>.
      # Both names come from the exports of ecs-cluster.yaml and
      # ecs-service.yaml — never a hardcoded value.
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          ServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity

  # ==========================================================================
  # SCALING POLICY — declares HOW to scale.
  #
  # Target Tracking rather than Step Scaling: this is the approach recommended
  # by AWS and the one that literally matches requirement F3 ("CPU target").
  # We set a target (70%), and AWS itself calculates how many tasks to
  # adjust — no thresholds to maintain by hand.
  #
  # ECSServiceAverageCPUUtilization is a predefined metric: it maps to the
  # average AWS/ECS CPUUtilization for the service, without having to declare
  # dimensions.
  # ==========================================================================
  CpuTargetTrackingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-${Environment}-ecs-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization
        ScaleOutCooldown: !Ref ScaleOutCooldown
        ScaleInCooldown: !Ref ScaleInCooldown
        # DisableScaleIn stays false: we ALSO WANT to reduce the number of
        # tasks when load decreases (requirement F3 says "increases or decreases").
        DisableScaleIn: false

  # ==========================================================================
  # OBSERVABILITY ALARM 1 — sustained CPU above the threshold.
  #
  # Does not drive scaling (see note at the top of the file). It signals that
  # CPU remains significantly above the target for 5 minutes: either load is
  # rising faster than scale-out can keep up, or MaxCapacity has been reached.
  # OKActions is configured to also receive the return to normal.
  # ==========================================================================
  ServiceHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-cpu-high'
      AlarmDescription: !Sub >-
        Average CPU of the ECS service above ${HighCpuAlarmThreshold}% for
        5 minutes, while the auto scaling target is
        ${TargetCpuUtilization}%.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
        - Name: ServiceName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref HighCpuAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      # A service that is not yet running emits no data: this should not
      # trigger the alarm.
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'
      OKActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

  # ==========================================================================
  # OBSERVABILITY ALARM 2 — maximum capacity reached.
  #
  # This is operationally the more useful of the two alarms: when the service
  # runs at MaxCapacity, auto scaling has no more headroom and any additional
  # load will degrade latency. The signal to receive is "MaxCapacity needs to
  # be raised (or the application needs to be optimized)".
  #
  # RunningTaskCount comes from ECS/ContainerInsights, available because
  # Container Insights is enabled on the cluster (ecs-cluster.yaml). If
  # Container Insights were disabled, this alarm would remain in
  # INSUFFICIENT_DATA (made harmless by TreatMissingData: notBreaching).
  # ==========================================================================
  ServiceMaxCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-max-capacity'
      AlarmDescription: !Sub >-
        The ECS service is running at its maximum capacity (${MaxCapacity} tasks):
        auto scaling has no more room to maneuver.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
        - Name: ServiceName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref MaxCapacity
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

# ------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------
Outputs:
  ScalableTargetId:
    Description: ScalableTarget ID (service/<cluster>/<service>)
    Value: !Ref ServiceScalableTarget
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-scalable-target-id'

  ScalingPolicyArn:
    Description: ARN of the Target Tracking CPU scaling policy
    Value: !Ref CpuTargetTrackingPolicy
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cpu-policy-arn'

  CapacityRange:
    Description: Scaling limits applied to the service (min-max)
    Value: !Sub '${MinCapacity}-${MaxCapacity}'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-capacity-range'

  HighCpuAlarmName:
    Description: Name of the sustained CPU CloudWatch alarm
    Value: !Ref ServiceHighCpuAlarm

  MaxCapacityAlarmName:
    Description: Name of the maximum capacity CloudWatch alarm
    Value: !Ref ServiceMaxCapacityAlarm
