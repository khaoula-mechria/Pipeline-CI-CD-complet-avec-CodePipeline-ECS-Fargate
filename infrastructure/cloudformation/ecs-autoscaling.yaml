AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Auto Scaling for the ECS Fargate service (Application Auto Scaling) for the
  project (AWS CI/CD).
  F3 of the requirements: "The number of Fargate tasks scales automatically
  according to CPU load (HPA-like via Application Auto Scaling)".
  - ScalableTarget on ecs:service:DesiredCount (min/max configurable).
  - Target Tracking ScalingPolicy on the average CPU of the service
    (target 70% by default).
  - 2 CloudWatch observability alarms (sustained CPU, maximum capacity reached)
    notifying the pipeline SNS topic. They do NOT control scaling (see the note
    below): they warn the team.

# ------------------------------------------------------------------
# NOTE SUR L'ORDRE DE DePLOIEMENT (voir ecs-cluster.yaml) :
#   ... 9. ecs-service.yaml   10. pipeline.yml
#   11. ecs-autoscaling.yaml   <- cette stack
#   12. observability.yml
#
# Doit être deployee APReS ecs-service.yaml (le ScalableTarget s'attache a un
# service qui doit deja exister) ET APReS pipeline.yml (les alarmes notifient
# le topic SNS cree la-bas).
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# DEUX POINTS IMPORTANTS a COMPRENDRE AVANT DE MODIFIER CE TEMPLATE
#
# 1) Target Tracking cree SES PROPRES alarmes CloudWatch, invisibles ici.
#    Application Auto Scaling gere automatiquement une paire d'alarmes
#    (nommees "TargetTracking-service/...") pour declencher le scale-out et le
#    scale-in. Les 2 alarmes definies plus bas dans ce template ne servent donc
#    PAS a scaler : elles existent pour PReVENIR l'equipe (F4). Ne pas les
#    supprimer en pensant casser le scaling, et ne pas les cabler a une
#    ScalingPolicy — ce serait redondant et source de conflits.
#
# 2) DesiredCount de ecs-service.yaml devient une valeur INITIALE seulement.
#    Des que ce ScalableTarget est attache, c'est Application Auto Scaling qui
#    possede DesiredCount. Une mise a jour de la stack ecs-service.yaml peut le
#    remettre transitoirement a sa valeur de parametre (2 par defaut) :
#    Application Auto Scaling le corrigera a la prochaine evaluation (il
#    applique au minimum MinCapacity, puis ajuste selon le CPU reel).
#    C'est un comportement connu de CloudFormation + Application Auto Scaling,
#    pas un bug de ces templates.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# PARAMeTRES
# ------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: taskmanager
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Must match the ProjectName of the other stacks.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment of the other stacks.

  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    Description: >
      Minimum number of Fargate tasks. Keep >= 2 to remain distributed across
      2 AZs (consistent with the default DesiredCount in ecs-service.yaml).

  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 1
    Description: >
      Maximum number of Fargate tasks. This is both a cost and load ceiling:
      6 tasks at 256 CPU / 512 MB remain modest.

  TargetCpuUtilization:
    Type: Number
    Default: 70
    MinValue: 10
    MaxValue: 90
    Description: >
      Average CPU target for the service, in percent (F3: 70%). Application
      Auto Scaling adds or removes tasks to maintain this average.

  ScaleOutCooldown:
    Type: Number
    Default: 60
    MinValue: 0
    Description: >
      Delay (s) before a new scale-out. Intentionally short: it is better to
      react quickly to rising load.

  ScaleInCooldown:
    Type: Number
    Default: 300
    MinValue: 0
    Description: >
      Delay (s) before a new scale-in. Intentionally longer than scale-out to
      avoid flapping when the load oscillates.

  HighCpuAlarmThreshold:
    Type: Number
    Default: 85
    MinValue: 10
    MaxValue: 100
    Description: >
      Threshold (%) for the observability CPU alarm. Keep it ABOVE
      TargetCpuUtilization: reaching the target is normal; exceeding it
      significantly and for a sustained period means scaling is not keeping up.

# ------------------------------------------------------------------
# RESSOURCES
# ------------------------------------------------------------------
Resources:

  # ==========================================================================
  # SCALABLE TARGET — declare CE QUI peut scaler et entre quelles bornes.
  #
  # Pas de RoleARN : Application Auto Scaling utilise automatiquement le rôle
  # lie au service (AWSServiceRoleForApplicationAutoScaling_ECSService), cree
  # par AWS a la premiere utilisation. C'est la raison pour laquelle iam.yaml
  # n'a eu besoin d'AUCUNE modification pour cette fonctionnalite.
  # ==========================================================================
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: 'ecs:service:DesiredCount'
      # Format impose par ECS : service/<nom du cluster>/<nom du service>.
      # Les deux noms viennent des exports de ecs-cluster.yaml et
      # ecs-service.yaml — jamais de valeur en dur.
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
          ServiceName: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity

  # ==========================================================================
  # SCALING POLICY — declare COMMENT scaler.
  #
  # Target Tracking plutôt que Step Scaling : c'est l'approche recommandee par
  # AWS et celle qui correspond litteralement a l'enonce F3 ("cible CPU").
  # On fixe un objectif (70 %), AWS calcule lui-même de combien de taches
  # ajuster — pas de paliers a maintenir a la main.
  #
  # ECSServiceAverageCPUUtilization est une metrique predefinie : elle mappe
  # sur AWS/ECS CPUUtilization moyenne sur le service, sans avoir a declarer
  # les dimensions.
  # ==========================================================================
  CpuTargetTrackingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-${Environment}-ecs-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization
        ScaleOutCooldown: !Ref ScaleOutCooldown
        ScaleInCooldown: !Ref ScaleInCooldown
        # DisableScaleIn resterait a false : on VEUT aussi reduire le nombre de
        # taches quand la charge baisse (l'enonce F3 dit "augmente ou diminue").
        DisableScaleIn: false

  # ==========================================================================
  # ALARME D'OBSERVABILITe 1 — CPU soutenu au-dela du seuil.
  #
  # Ne pilote pas le scaling (cf. note en haut du fichier). Elle signale que le
  # CPU reste nettement au-dessus de la cible pendant 5 minutes : soit la
  # charge monte plus vite que le scale-out, soit MaxCapacity est atteint.
  # OKActions est renseigne pour recevoir aussi le retour a la normale.
  # ==========================================================================
  ServiceHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-cpu-high'
      AlarmDescription: !Sub >-
        CPU moyen du service ECS au-dessus de ${HighCpuAlarmThreshold}% pendant
        5 minutes, alors que la cible d'auto scaling est
        ${TargetCpuUtilization}%.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
        - Name: ServiceName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref HighCpuAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      # Un service qui ne tourne pas encore n'emet aucune donnee : ne pas
      # declencher l'alarme pour autant.
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'
      OKActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

  # ==========================================================================
  # ALARME D'OBSERVABILITe 2 — capacite maximale atteinte.
  #
  # C'est l'alarme operationnellement la plus utile des deux : quand le service
  # tourne a MaxCapacity, l'auto scaling n'a plus de marge et toute charge
  # supplementaire degradera la latence. Le signal a recevoir est "il faut
  # relever MaxCapacity (ou optimiser l'application)".
  #
  # RunningTaskCount vient de ECS/ContainerInsights, disponible parce que
  # Container Insights est active sur le cluster (ecs-cluster.yaml). Si
  # Container Insights etait desactive, cette alarme resterait en
  # INSUFFICIENT_DATA (rendue inoffensive par TreatMissingData: notBreaching).
  # ==========================================================================
  ServiceMaxCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-max-capacity'
      AlarmDescription: !Sub >-
        Le service ECS tourne a sa capacite maximale (${MaxCapacity} taches) :
        l'auto scaling n'a plus de marge de manoeuvre.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-cluster-name'
        - Name: ServiceName
          Value: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ecs-service-name'
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref MaxCapacity
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-pipeline-notifications-arn'

# ------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------
Outputs:
  ScalableTargetId:
    Description: ScalableTarget ID (service/<cluster>/<service>)
    Value: !Ref ServiceScalableTarget
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-scalable-target-id'

  ScalingPolicyArn:
    Description: ARN of the Target Tracking CPU scaling policy
    Value: !Ref CpuTargetTrackingPolicy
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-cpu-policy-arn'

  CapacityRange:
    Description: Scaling limits applied to the service (min-max)
    Value: !Sub '${MinCapacity}-${MaxCapacity}'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ecs-capacity-range'

  HighCpuAlarmName:
    Description: Name of the sustained CPU CloudWatch alarm
    Value: !Ref ServiceHighCpuAlarm

  MaxCapacityAlarmName:
    Description: Name of the maximum capacity CloudWatch alarm
    Value: !Ref ServiceMaxCapacityAlarm
